    - data:
        code: "def main(\n    tax_case_id: str,\n    transaction_facts: list,\n  \
          \  regulation_results: list,\n    tax_judgement_payload: dict,\n    economic_substance:\
          \ dict,\n    evidence_state: dict\n) -> dict:\n\n    transaction_facts =\
          \ (\n        transaction_facts if isinstance(transaction_facts, list) else\
          \ []\n    )\n    regulation_results = (\n        regulation_results if isinstance(regulation_results,\
          \ list) else []\n    )\n    tax_judgement_payload = (\n        tax_judgement_payload\n\
          \        if isinstance(tax_judgement_payload, dict)\n        else {}\n \
          \   )\n    economic_substance = (\n        economic_substance if isinstance(economic_substance,\
          \ dict) else {}\n    )\n    evidence_state = (\n        evidence_state if\
          \ isinstance(evidence_state, dict) else {}\n    )\n\n    case_id = (\n \
          \       tax_case_id\n        or tax_judgement_payload.get(\"tax_case_id\"\
          )\n        or \"TaxCase.DifyPlaceholder\"\n    )\n\n    transaction_fact_refs\
          \ = [\n        item.get(\"transaction_fact_id\")\n        for item in transaction_facts\n\
          \        if isinstance(item, dict) and item.get(\"transaction_fact_id\"\
          )\n    ]\n\n    regulation_result_refs = [\n        item.get(\"regulation_result_id\"\
          )\n        for item in regulation_results\n        if isinstance(item, dict)\
          \ and item.get(\"regulation_result_id\")\n    ]\n\n    rule_engine_input\
          \ = {\n        \"tax_case_id\": case_id,\n        \"transaction_fact_refs\"\
          : transaction_fact_refs,\n        \"economic_substance_refs\": [],\n   \
          \     \"consistency_check_refs\": [],\n        \"regulation_result_refs\"\
          : regulation_result_refs,\n        \"evidence_state_refs\": [],\n      \
          \  \"actual_tax_filing_refs\": [],\n        \"actual_tax_payment_refs\"\
          : []\n    }\n\n    rule_engine_output = {\n        \"tax_case_id\": case_id,\n\
          \        \"rule_execution_results\": [],\n        \"judgement_resolution_results\"\
          : []\n    }\n\n    upstream_ready = bool(\n        transaction_facts\n \
          \       and regulation_results\n        and tax_judgement_payload\n    \
          \    and economic_substance\n        and evidence_state\n    )\n\n    if\
          \ upstream_ready:\n        rule_engine_status = \"waiting_for_formal_rules\"\
          \n    else:\n        rule_engine_status = \"waiting_for_upstream_nodes\"\
          \n\n    score_preview = {\n        \"tax_case_id\": case_id,\n        \"\
          tax_health_score\": None,\n        \"total_health_score_loss\": None,\n\
          \        \"final_risk_event_ids\": [],\n        \"calculation_status\":\
          \ rule_engine_status\n    }\n\n    evidence_coverage_preview = {\n     \
          \   \"tax_case_id\": case_id,\n        \"evidence_coverage\": None,\n  \
          \      \"total_evidence_coverage_loss\": None,\n        \"evidence_loss_details\"\
          : [],\n        \"calculation_status\": rule_engine_status\n    }\n\n   \
          \ return {\n        \"rule_engine_input\": rule_engine_input,\n        \"\
          rule_engine_output\": rule_engine_output,\n        \"score_preview\": score_preview,\n\
          \        \"evidence_coverage_preview\": evidence_coverage_preview,\n   \
          \     \"risk_level\": \"unknown\",\n        \"risk_codes\": [],\n      \
          \  \"evidence_gaps\": [],\n        \"rule_engine_status\": rule_engine_status\n\
          \    }"

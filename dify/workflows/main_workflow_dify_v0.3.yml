    - data:
        code: "import json\n\ndef main(tax_case_id: str, contract_chains: list, transaction_facts:\
          \ list) -> dict:\n    if not isinstance(contract_chains, list):\n      \
          \  contract_chains = []\n\n    if not isinstance(transaction_facts, list):\n\
          \        transaction_facts = []\n\n    case_id = tax_case_id or \"TaxCase.DifyPlaceholder\"\
          \n\n    chain_metrics = []\n\n    for idx, chain in enumerate(contract_chains):\n\
          \        if not isinstance(chain, dict):\n            continue\n\n     \
          \   contract_chain_id = chain.get(\"contract_chain_id\") or \"Chain.%03d\"\
          \ % (idx + 1)\n        contract_nodes = chain.get(\"contract_nodes\")\n\n\
          \        if not isinstance(contract_nodes, list):\n            contract_nodes\
          \ = []\n\n        source_contract_node_ids = []\n        amount_breakdown\
          \ = []\n\n        for node in contract_nodes:\n            if not isinstance(node,\
          \ dict):\n                continue\n\n            node_id = node.get(\"\
          contract_node_id\")\n\n            if node_id:\n                source_contract_node_ids.append(node_id)\n\
          \n            amount = node.get(\"amount\")\n\n            if isinstance(amount,\
          \ (int, float)):\n                amount_breakdown.append({\n          \
          \          \"amount_item_id\": \"Amount.%03d\" % (len(amount_breakdown)\
          \ + 1),\n                    \"amount_role\": \"unknown\",\n           \
          \         \"amount\": amount,\n                    \"currency\": node.get(\"\
          currency\") or \"CNY\",\n                    \"source_contract_node_id\"\
          : node_id or \"unknown\",\n                    \"source_document_id\": node.get(\"\
          source_document_id\"),\n                    \"source_fact_id\": node.get(\"\
          contract_fact_id\"),\n                    \"explanation\": \"Amount role\
          \ is unknown until formal contract relation extraction is available.\"\n\
          \                })\n\n        transaction_fact_ids = []\n\n        for\
          \ fact in transaction_facts:\n            if isinstance(fact, dict) and\
          \ fact.get(\"transaction_fact_id\"):\n                transaction_fact_ids.append(fact.get(\"\
          transaction_fact_id\"))\n\n        metric = {\n            \"chain_metric_id\"\
          : \"ChainMetric.%03d\" % (idx + 1),\n            \"contract_chain_id\":\
          \ contract_chain_id,\n            \"calculation_status\": \"insufficient_data\"\
          ,\n            \"total_revenue_amount\": None,\n            \"total_cost_amount\"\
          : None,\n            \"hidden_profit_amount\": None,\n            \"hidden_profit_rate\"\
          : None,\n            \"currency\": \"CNY\",\n            \"revenue_contract_node_ids\"\
          : [],\n            \"cost_contract_node_ids\": [],\n            \"source_contract_node_ids\"\
          : source_contract_node_ids,\n            \"source_transaction_fact_ids\"\
          : transaction_fact_ids,\n            \"amount_breakdown\": amount_breakdown,\n\
          \            \"calculation_basis\": \"No formal revenue/cost direction is\
          \ available yet, so chain metrics are kept as insufficient_data.\",\n  \
          \          \"warnings\": [\n                \"Formal revenue/cost classification\
          \ is waiting for Facts Nodes and chain relation extraction.\"\n        \
          \    ],\n            \"trace\": {\n                \"calculated_from\":\
          \ source_contract_node_ids,\n                \"missing_fields\": [\n   \
          \                 \"revenue_contract_node_ids\",\n                    \"\
          cost_contract_node_ids\",\n                    \"formal_contract_relations\"\
          \n                ],\n                \"notes\": [\n                   \
          \ \"Placeholder chain metric calculation for v0.3 workflow skeleton.\"\n\
          \                ]\n            }\n        }\n\n        chain_metrics.append(metric)\n\
          \n    chain_metrics_payload = {\n        \"tax_case_id\": case_id,\n   \
          \     \"chain_metrics\": chain_metrics\n    }\n\n    return {\n        \"\
          chain_metrics\": chain_metrics,\n        \"chain_metrics_payload\": chain_metrics_payload,\n\
          \        \"chain_metrics_status\": \"waiting_for_formal_chain_metrics\"\
          ,\n        \"chain_metrics_payload_text\": json.dumps(chain_metrics_payload,\
          \ ensure_ascii=False)\n    }"

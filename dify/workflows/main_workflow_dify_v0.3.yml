          \n    contract_count = len(contract_documents)\n    is_multi_contract =\
          \ contract_count > 1\n\n    if contract_count == 0:\n        workflow_route\
          \ = \"no_contract\"\n    elif is_multi_contract:\n        workflow_route\
          \ = \"multi_contract_chain\"\n    else:\n        workflow_route = \"single_contract_tax_judgement\"\
          \n\n    return {\n        \"contract_count\": contract_count,\n        \"\
          is_multi_contract\": is_multi_contract,\n        \"workflow_route\": workflow_route,\n\
          \        \"contract_documents\": contract_documents\n    }"

    - data:
        code: "import json\n\ndef main(tax_case_id: str, transaction_facts: list,\
          \ regulation_results: list, tax_judgement_payload: dict, economic_substance:\
          \ dict, evidence_state: dict) -> dict:\n    transaction_facts = transaction_facts\
          \ if isinstance(transaction_facts, list) else []\n    regulation_results\
          \ = regulation_results if isinstance(regulation_results, list) else []\n\
          \    tax_judgement_payload = tax_judgement_payload if isinstance(tax_judgement_payload,\
          \ dict) else {}\n    economic_substance = economic_substance if isinstance(economic_substance,\
          \ dict) else {}\n    evidence_state = evidence_state if isinstance(evidence_state,\
          \ dict) else {}\n\n    case_id = tax_case_id or tax_judgement_payload.get(\"\
          tax_case_id\") or \"TaxCase.DifyPlaceholder\"\n\n    transaction_fact_refs\
          \ = []\n    for item in transaction_facts:\n        if isinstance(item,\
          \ dict) and item.get(\"transaction_fact_id\"):\n            transaction_fact_refs.append(item.get(\"\
          transaction_fact_id\"))\n\n    regulation_result_refs = []\n    for item\
          \ in regulation_results:\n        if isinstance(item, dict) and item.get(\"\
          regulation_result_id\"):\n            regulation_result_refs.append(item.get(\"\
          regulation_result_id\"))\n\n    rule_engine_input = {\n        \"tax_case_id\"\
          : case_id,\n        \"transaction_fact_refs\": transaction_fact_refs,\n\
          \        \"economic_substance_refs\": [],\n        \"consistency_check_refs\"\
          : [],\n        \"regulation_result_refs\": regulation_result_refs,\n   \
          \     \"evidence_state_refs\": [],\n        \"actual_tax_filing_refs\":\
          \ [],\n        \"actual_tax_payment_refs\": []\n    }\n\n    rule_engine_output\
          \ = {\n        \"tax_case_id\": case_id,\n        \"rule_execution_results\"\
          : [],\n        \"judgement_resolution_results\": []\n    }\n\n    if transaction_facts\
          \ and regulation_results and tax_judgement_payload and economic_substance\
          \ and evidence_state:\n        rule_engine_status = \"waiting_for_formal_rules\"\
          \n    else:\n        rule_engine_status = \"waiting_for_upstream_nodes\"\
          \n\n    score_preview = {\n        \"tax_case_id\": case_id,\n        \"\
          tax_health_score\": None,\n        \"total_health_score_loss\": None,\n\
          \        \"final_risk_event_ids\": [],\n        \"calculation_status\":\
          \ rule_engine_status\n    }\n\n    evidence_coverage_preview = {\n     \
          \   \"tax_case_id\": case_id,\n        \"evidence_coverage\": None,\n  \
          \      \"total_evidence_coverage_loss\": None,\n        \"evidence_loss_details\"\
          : [],\n        \"calculation_status\": rule_engine_status\n    }\n\n   \
          \ score_preview_text = json.dumps(score_preview, ensure_ascii=False)\n \
          \   evidence_coverage_preview_text = json.dumps(evidence_coverage_preview,\
          \ ensure_ascii=False)\n\n    return {\n        \"rule_engine_input\": rule_engine_input,\n\
          \        \"rule_engine_output\": rule_engine_output,\n        \"score_preview\"\
          : score_preview,\n        \"evidence_coverage_preview\": evidence_coverage_preview,\n\
          \        \"risk_level\": \"unknown\",\n        \"risk_codes\": [],\n   \
          \     \"evidence_gaps\": [],\n        \"rule_engine_status\": rule_engine_status,\n\
          \        \"score_preview_text\": score_preview_text,\n        \"evidence_coverage_preview_text\"\
          : evidence_coverage_preview_text\n    }"

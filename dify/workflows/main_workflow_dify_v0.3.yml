    - data:
        code: "import json\n\ndef main(tax_case_id: str, contract_documents: list,\
          \ transaction_facts: list) -> dict:\n    if not isinstance(contract_documents,\
          \ list):\n        contract_documents = []\n\n    if not isinstance(transaction_facts,\
          \ list):\n        transaction_facts = []\n\n    case_id = tax_case_id or\
          \ \"TaxCase.DifyPlaceholder\"\n\n    contract_nodes = []\n    source_document_ids\
          \ = []\n\n    for idx, doc in enumerate(contract_documents):\n        if\
          \ not isinstance(doc, dict):\n            continue\n\n        source_document_id\
          \ = (\n            doc.get(\"source_document_id\")\n            or doc.get(\"\
          document_id\")\n            or \"SourceDocument.%03d\" % (idx + 1)\n   \
          \     )\n\n        source_document_ids.append(source_document_id)\n\n  \
          \      contract_nodes.append({\n            \"contract_node_id\": \"Chain.001.Node.%03d\"\
          \ % (idx + 1),\n            \"source_document_id\": source_document_id,\n\
          \            \"contract_fact_id\": doc.get(\"contract_fact_id\"),\n    \
          \        \"document_role\": doc.get(\"contract_document_role\") or \"unknown\"\
          ,\n            \"contract_name\": doc.get(\"contract_name\") or \"Contract\
          \ %d\" % (idx + 1),\n            \"counterparty_name\": doc.get(\"counterparty_name\"\
          ) or \"unknown\",\n            \"subject_summary\": doc.get(\"subject_summary\"\
          ) or \"\",\n            \"amount\": doc.get(\"amount\"),\n            \"\
          currency\": doc.get(\"currency\") or \"CNY\",\n            \"signing_date\"\
          : doc.get(\"signing_date\"),\n            \"economic_substance\": doc.get(\"\
          economic_substance\")\n        })\n\n    contract_edges = []\n\n    for\
          \ idx in range(len(contract_nodes) - 1):\n        contract_edges.append({\n\
          \            \"from_contract_node_id\": contract_nodes[idx][\"contract_node_id\"\
          ],\n            \"to_contract_node_id\": contract_nodes[idx + 1][\"contract_node_id\"\
          ],\n            \"relation_type\": \"unknown\",\n            \"relation_status\"\
          : \"candidate\",\n            \"relation_reason\": \"Multiple contracts\
          \ were uploaded in the same Tax Case. Formal relation extraction is waiting\
          \ for Facts Nodes.\",\n            \"source_fact_ids\": []\n        })\n\
          \n    transaction_fact_ids = []\n\n    for item in transaction_facts:\n\
          \        if isinstance(item, dict) and item.get(\"transaction_fact_id\"\
          ):\n            transaction_fact_ids.append(item.get(\"transaction_fact_id\"\
          ))\n\n    contract_chain = {\n        \"contract_chain_id\": \"Chain.001\"\
          ,\n        \"chain_sequence_no\": 1,\n        \"chain_type\": \"related_contract_group\"\
          ,\n        \"chain_status\": \"candidate\",\n        \"contract_nodes\"\
          : contract_nodes,\n        \"contract_edges\": contract_edges,\n       \
          \ \"source_document_ids\": source_document_ids,\n        \"transaction_fact_ids\"\
          : transaction_fact_ids,\n        \"chain_summary\": \"Candidate multi-contract\
          \ chain built from contracts uploaded in the current Tax Case.\",\n    \
          \    \"trace\": {\n            \"built_from\": source_document_ids,\n  \
          \          \"notes\": [\n                \"Placeholder chain builder for\
          \ v0.3 workflow skeleton.\",\n                \"Formal relation classification\
          \ requires Contract Facts and Actual Facts.\"\n            ]\n        }\n\
          \    }\n\n    contract_chains = [contract_chain] if contract_nodes else\
          \ []\n\n    contract_chain_payload = {\n        \"tax_case_id\": case_id,\n\
          \        \"contract_chains\": contract_chains\n    }\n\n    return {\n \
          \       \"contract_chains\": contract_chains,\n        \"contract_chain_payload\"\
          : contract_chain_payload,\n        \"contract_chain_status\": \"waiting_for_formal_chain_extraction\"\
          ,\n        \"contract_chain_payload_text\": json.dumps(contract_chain_payload,\
          \ ensure_ascii=False)\n    }"

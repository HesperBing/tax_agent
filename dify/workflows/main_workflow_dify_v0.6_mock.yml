          ,\n                \"amount_role\":\n                    \"combined_contract_amount\"\
          ,\n                \"amount\": contract_amount,\n                \"currency\"\
          : currency,\n                \"source_contract_node_id\":\n            \
          \        (\n                        source_contract_node_ids[0]\n      \
          \                  if source_contract_node_ids\n                       \
          \ else None\n                    ),\n                \"source_document_id\"\
          :\n                    \"CONTRACT-FACT-CT01\",\n                \"source_fact_id\"\
          :\n                    \"CONTRACT-FACT-CT01\",\n                \"explanation\"\
          :\n                    \"该金额是三份合同合并金额；\"\n                    \"当前材料不足以分配各合同的收入、\"\
          \n                    \"成本及利润金额。\"\n            })\n\n        metric = {\n\
          \            \"chain_metric_id\":\n                f\"CHAIN-METRIC-{index\
          \ + 1:03d}\",\n            \"contract_chain_id\":\n                chain_id,\n\
          \            \"calculation_status\":\n                \"complete_needs_review\"\
          ,\n            \"total_revenue_amount\": None,\n            \"total_cost_amount\"\
          : None,\n            \"hidden_profit_amount\": None,\n            \"hidden_profit_rate\"\
          : None,\n            \"currency\": currency,\n            \"revenue_contract_node_ids\"\
          : [],\n            \"cost_contract_node_ids\": [],\n            \"source_contract_node_ids\"\
          :\n                source_contract_node_ids,\n            \"source_transaction_fact_ids\"\
          :\n                transaction_fact_ids,\n            \"amount_breakdown\"\
          :\n                amount_breakdown,\n            \"calculation_basis\"\
          :\n                \"已保留合同合并金额，但没有足够事实\"\n                \"确定收入、成本方向及隐藏利润。\"\
          ,\n            \"warnings\": [\n                \"不得将合同总金额直接认定为收入或成本。\"\
          ,\n                \"不得因金额无法分配而直接认定税务风险。\",\n                \"需要人工复核各合同的付款方向和经济角色。\"\
          \n            ],\n            \"trace\": {\n                \"calculated_from\"\
          :\n                    source_contract_node_ids,\n                \"missing_fields\"\

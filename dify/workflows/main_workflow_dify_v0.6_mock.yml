          contract_chain_id\")\n            or f\"CONTRACT-CHAIN-{index + 1:03d}\"\
          \n        )\n\n        contract_nodes = chain.get(\n            \"contract_nodes\"\
          , []\n        )\n\n        if not isinstance(contract_nodes, list):\n  \
          \          contract_nodes = []\n\n        source_contract_node_ids = []\n\
          \n        for node in contract_nodes:\n            if not isinstance(node,\

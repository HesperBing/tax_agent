    - data:
        code: "def main(transaction_facts: list) -> dict:\n    if not isinstance(transaction_facts,\
          \ list):\n        transaction_facts = []\n\n    contract_fact_refs = []\n\
          \n    for fact in transaction_facts:\n        if not isinstance(fact, dict):\n\
          \            continue\n\n        refs = fact.get(\"contract_fact_refs\"\
          , [])\n\n        if not isinstance(refs, list):\n            continue\n\n\
          \        for ref in refs:\n            if ref and ref not in contract_fact_refs:\n\
          \                contract_fact_refs.append(ref)\n\n    contract_names =\
          \ {\n        \"CONTRACT-FACT-CT01\": \"CT01 数字化战略咨询\",\n        \"CONTRACT-FACT-CT02\"\
          : \"CT02 数据治理实施\",\n        \"CONTRACT-FACT-CT03\": \"CT03 独立质量复核\"\n  \
          \  }\n\n    contract_documents = []\n\n    for index, ref in enumerate(contract_fact_refs):\n\
          \        contract_documents.append({\n            \"source_document_id\"\
          : ref,\n            \"source_file_type\": \"contract\",\n            \"\
          contract_fact_id\": ref,\n            \"contract_document_role\": (\n  \
          \              \"main_contract\"\n                if index == 0\n      \
          \          else \"related_contract\"\n            ),\n            \"contract_name\"\
          : contract_names.get(\n                ref, ref\n            ),\n      \
          \      \"counterparty_name\": \"unknown\",\n            \"subject_summary\"\
          : contract_names.get(\n                ref, ref\n            ),\n      \
          \      \"amount\": None,\n            \"currency\": \"CNY\",\n         \
          \   \"signing_date\": None,\n            \"economic_substance\":\n     \
          \           \"technical_consulting\"\n        })\n\n    contract_count =\
          \ len(contract_fact_refs)\n    is_multi_contract = contract_count > 1\n\n\
          \    if contract_count == 0:\n        workflow_route = \"no_contract\"\n\
          \    elif is_multi_contract:\n        workflow_route = \"multi_contract_chain\"\
          \n    else:\n        workflow_route = (\n            \"single_contract_tax_judgement\"\
          \n        )\n\n    return {\n        \"contract_count\": contract_count,\n\
          \        \"is_multi_contract\": is_multi_contract,\n        \"workflow_route\"\
          : workflow_route,\n        \"contract_documents\": contract_documents\n\
          \    }"

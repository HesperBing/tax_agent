    - data:
        code: "def main(texts: list, classifications: list) -> dict:\n    allowed_file_types\
          \ = {\n        \"contract\",\n        \"invoice\",\n        \"payment_receipt\"\
          ,\n        \"withholding_certificate\",\n        \"tax_filing_material\"\
          ,\n        \"tax_payment_certificate\",\n        \"acceptance_material\"\
          ,\n        \"delivery_material\",\n        \"other\",\n    }\n\n    allowed_contract_roles\
          \ = {\n        \"main_contract\",\n        \"supplementary_agreement\",\n\
          \        \"amendment_agreement\",\n    }\n\n    if not isinstance(texts,\
          \ list):\n        texts = []\n\n    if not isinstance(classifications, list):\n\
          \        classifications = []\n\n    valid_documents = []\n    validation_errors\
          \ = []\n\n    total_count = max(len(texts), len(classifications))\n\n  \
          \  for index in range(total_count):\n        text = texts[index] if index\
          \ < len(texts) else \"\"\n        classification = (\n            classifications[index]\n\
          \            if index < len(classifications)\n            and isinstance(classifications[index],\
          \ dict)\n            else {}\n        )\n\n        status = classification.get(\"\
          classification_status\")\n        source_file_type = classification.get(\"\
          source_file_type\")\n        contract_document_role = classification.get(\"\
          contract_document_role\")\n\n        error_codes = []\n\n        if not\
          \ isinstance(text, str) or not text.strip():\n            error_codes.append(\"\
          EMPTY_EXTRACTED_TEXT\")\n\n        if not classification:\n            error_codes.append(\"\
          MISSING_CLASSIFICATION_RESULT\")\n        else:\n            if status not\
          \ in {\"success\", \"failed\"}:\n                error_codes.append(\"INVALID_CLASSIFICATION_STATUS\"\
          )\n\n            if status == \"success\":\n                if source_file_type\
          \ not in allowed_file_types:\n                    error_codes.append(\"\
          INVALID_SOURCE_FILE_TYPE\")\n\n                if source_file_type == \"\
          contract\":\n                    if contract_document_role not in allowed_contract_roles:\n\
          \                        error_codes.append(\"INVALID_CONTRACT_DOCUMENT_ROLE\"\
          )\n                elif contract_document_role is not None:\n          \
          \          error_codes.append(\"UNEXPECTED_CONTRACT_DOCUMENT_ROLE\")\n\n\
          \            if status == \"failed\":\n                error_codes.append(\"\
          CLASSIFICATION_FAILED\")\n\n                if source_file_type is not None:\n\
          \                    error_codes.append(\"FAILED_TYPE_MUST_BE_NULL\")\n\n\
          \                if contract_document_role is not None:\n              \
          \      error_codes.append(\"FAILED_ROLE_MUST_BE_NULL\")\n\n        if error_codes:\n\
          \            validation_errors.append(\n                {\n            \
          \        \"file_index\": index,\n                    \"error_codes\": error_codes,\n\
          \                }\n            )\n        else:\n            valid_documents.append(\n\
          \                {\n                    \"file_index\": index,\n       \
          \             \"document_text\": text,\n                    \"classification_status\"\
          : status,\n                    \"source_file_type\": source_file_type,\n\
          \                    \"contract_document_role\": contract_document_role,\n\
          \                }\n            )\n\n    return {\n        \"valid_documents\"\
          : valid_documents,\n        \"validation_errors\": validation_errors,\n\
          \        \"has_errors\": len(validation_errors) > 0,\n        \"total_count\"\
          : total_count,\n        \"valid_count\": len(valid_documents),\n       \
          \ \"error_count\": len(validation_errors),\n    }"
        code_language: python3

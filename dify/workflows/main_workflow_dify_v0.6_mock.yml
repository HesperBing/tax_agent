    - data:
        code: "import json\n\n\ndef main(\n    tax_case_id: str,\n    transaction_facts:\
          \ list,\n    regulation_results: list,\n    tax_judgement_payload: dict,\n\
          \    economic_substance: dict,\n    evidence_state: dict\n) -> dict:\n \
          \   transaction_facts = (\n        transaction_facts\n        if isinstance(transaction_facts,\
          \ list)\n        else []\n    )\n\n    regulation_results = (\n        regulation_results\n\
          \        if isinstance(regulation_results, list)\n        else []\n    )\n\
          \n    tax_judgement_payload = (\n        tax_judgement_payload\n       \
          \ if isinstance(tax_judgement_payload, dict)\n        else {}\n    )\n\n\
          \    economic_substance = (\n        economic_substance\n        if isinstance(economic_substance,\
          \ dict)\n        else {}\n    )\n\n    evidence_state = (\n        evidence_state\n\
          \        if isinstance(evidence_state, dict)\n        else {}\n    )\n\n\
          \    case_id = (\n        tax_case_id\n        or tax_judgement_payload.get(\"\
          tax_case_id\")\n        or \"TC-TAX-CROSS-001\"\n    )\n\n    def collect_refs(items,\
          \ field):\n        refs = []\n\n        for item in items:\n           \
          \ if isinstance(item, dict) and item.get(field):\n                refs.append(item[field])\n\
          \n        return refs\n\n    transaction_fact_refs = collect_refs(\n   \
          \     transaction_facts,\n        \"transaction_fact_id\"\n    )\n\n   \
          \ regulation_result_refs = collect_refs(\n        regulation_results,\n\
          \        \"regulation_result_id\"\n    )\n\n    substance_components = economic_substance.get(\n\
          \        \"economic_substance_components\", []\n    )\n\n    economic_substance_refs\
          \ = collect_refs(\n        substance_components,\n        \"substance_component_id\"\
          \n    )\n\n    evidence_states = evidence_state.get(\n        \"evidence_states\"\
          , []\n    )\n\n    evidence_state_refs = collect_refs(\n        evidence_states,\n\
          \        \"evidence_state_id\"\n    )\n\n    rule_engine_input = {\n   \
          \     \"tax_case_id\": case_id,\n        \"transaction_fact_refs\":\n  \
          \          transaction_fact_refs,\n        \"economic_substance_refs\":\n\
          \            economic_substance_refs,\n        \"consistency_check_refs\"\
          : [],\n        \"regulation_result_refs\":\n            regulation_result_refs,\n\
          \        \"evidence_state_refs\":\n            evidence_state_refs,\n  \
          \      \"actual_tax_filing_refs\": [],\n        \"actual_tax_payment_refs\"\
          : []\n    }\n\n    transaction_ref = (\n        transaction_fact_refs[0]\n\
          \        if transaction_fact_refs\n        else \"TRANSACTION-TC-TAX-CROSS-001\"\
          \n    )\n\n    regulation_ref = (\n        regulation_result_refs[0]\n \
          \       if regulation_result_refs\n        else \"REGULATION-TC-TAX-CROSS-001\"\
          \n    )\n\n    rule_execution_id = (\n        \"EXEC_RULE_VAT_SCOPE_REVIEW_001\"\
          \n    )\n\n    # 法规仍需人工复核，因此不能生成已确认违规。\n    rule_execution_results = [\n\
          \        {\n            \"rule_execution_id\":\n                rule_execution_id,\n\
          \            \"rule_id\":\n                \"RULE_VAT_SCOPE_REVIEW_001\"\
          ,\n            \"target_judgement_item\":\n                \"technical_consulting_vat_scope\"\
          ,\n            \"status\": \"unknown\",\n            \"value\": None,\n\
          \            \"legal_basis_ids\": [\n                \"LAW_VAT_H001\"\n\
          \            ],\n            \"fact_basis_ids\": [\n                regulation_ref,\n\
          \                transaction_ref\n            ],\n            \"evaluated_condition_ids\"\
          : [\n                \"COND_VAT_SUBSTANCE_001\",\n                \"COND_VAT_TEMPORAL_REVIEW_001\"\
          \n            ]\n        }\n    ]\n\n    judgement_resolution_results =\
          \ [\n        {\n            \"judgement_resolution_id\":\n             \
          \   \"RESOLUTION_technical_consulting_vat_scope\",\n            \"target_judgement_item\"\
          :\n                \"technical_consulting_vat_scope\",\n            \"resolution_status\"\
          :\n                \"insufficient\",\n            \"value\": None,\n   \
          \         \"legal_basis_ids\": [\n                \"LAW_VAT_H001\"\n   \
          \         ],\n            \"fact_basis_ids\": [\n                regulation_ref,\n\
          \                transaction_ref\n            ],\n            \"supporting_rule_execution_ids\"\
          : [\n                rule_execution_id\n            ],\n            \"conflicting_rule_execution_ids\"\
          : []\n        }\n    ]\n\n    rule_engine_output = {\n        \"tax_case_id\"\
          : case_id,\n        \"rule_execution_results\":\n            rule_execution_results,\n\
          \        \"judgement_resolution_results\":\n            judgement_resolution_results\n\
          \    }\n\n    requirement_instances = evidence_state.get(\n        \"evidence_requirement_instances\"\
          , []\n    )\n\n    requirement_map = {}\n\n    for item in requirement_instances:\n\
          \        if not isinstance(item, dict):\n            continue\n\n      \
          \  instance_id = item.get(\n            \"evidence_requirement_instance_id\"\
          \n        )\n\n        if instance_id:\n            requirement_map[instance_id]\
          \ = item\n\n    state_factor_map = {\n        \"provided\": 0,\n       \
          \ \"unknown\": 0.5,\n        \"missing\": 1\n    }\n\n    evidence_loss_details\
          \ = []\n    evidence_gaps = []\n    total_evidence_loss = 0\n\n    for state_item\
          \ in evidence_states:\n        if not isinstance(state_item, dict):\n  \
          \          continue\n\n        state = state_item.get(\"state\", \"unknown\"\
          )\n\n        if state == \"not_applicable\":\n            continue\n\n \
          \       instance_id = state_item.get(\n            \"evidence_requirement_instance_id\"\
          \n        ) or \"ERI-TC-TAX-CROSS-001\"\n\n        requirement = requirement_map.get(\n\
          \            instance_id, {}\n        )\n\n        requirement_id = requirement.get(\n\
          \            \"evidence_requirement_id\"\n        ) or \"contract_performance_evidence\"\
          \n\n        state_id = state_item.get(\n            \"evidence_state_id\"\
          \n        ) or \"EVIDENCE-STATE-TC-TAX-CROSS-001\"\n\n        configured_loss\
          \ = 12\n        state_factor = state_factor_map.get(\n            state,\
          \ 0.5\n        )\n\n        actual_loss = (\n            configured_loss\
          \ * state_factor\n        )\n\n        total_evidence_loss += actual_loss\n\
          \n        evidence_loss_details.append({\n            \"evidence_requirement_instance_id\"\
          :\n                instance_id,\n            \"evidence_requirement_id\"\
          :\n                requirement_id,\n            \"evidence_state_id\": state_id,\n\
          \            \"state\": state,\n            \"configured_loss\": configured_loss,\n\
          \            \"state_factor\": state_factor,\n            \"actual_evidence_coverage_loss\"\
          :\n                actual_loss\n        })\n\n        if state in [\"unknown\"\
          , \"missing\"]:\n            evidence_gaps.append({\n                \"\
          evidence_requirement_instance_id\":\n                    instance_id,\n\
          \                \"evidence_requirement_id\":\n                    requirement_id,\n\
          \                \"evidence_state_id\":\n                    state_id,\n\
          \                \"state\": state\n            })\n\n    evidence_coverage\
          \ = int(\n        max(\n            0,\n            100 - min(100, total_evidence_loss)\n\
          \        )\n    )\n\n    evidence_coverage_preview = {\n        \"tax_case_id\"\
          : case_id,\n        \"evidence_coverage\":\n            evidence_coverage,\n\
          \        \"total_evidence_coverage_loss\":\n            total_evidence_loss,\n\
          \        \"evidence_loss_details\":\n            evidence_loss_details,\n\
          \        \"calculation_status\":\n            \"complete\"\n    }\n\n  \
          \  # 当前没有“已确认风险”，所以健康分不扣分。\n    # 待复核和 unknown 不能当作违规。\n    score_preview\
          \ = {\n        \"tax_case_id\": case_id,\n        \"tax_health_score\":\
          \ 100,\n        \"total_health_score_loss\": 0,\n        \"final_risk_event_ids\"\
          : [],\n        \"calculation_status\":\n            \"complete_needs_review\"\
          \n    }\n\n    rule_engine_status = (\n        \"complete_needs_review\"\
          \n    )\n\n    return {\n        \"rule_engine_input\":\n            rule_engine_input,\n\
          \        \"rule_engine_output\":\n            rule_engine_output,\n    \
          \    \"score_preview\":\n            score_preview,\n        \"evidence_coverage_preview\"\
          :\n            evidence_coverage_preview,\n        \"risk_level\": \"low\"\
          ,\n        \"risk_codes\": [],\n        \"evidence_gaps\":\n           \
          \ evidence_gaps,\n        \"rule_engine_status\":\n            rule_engine_status,\n\
          \        \"score_preview_text\":\n            json.dumps(\n            \
          \    score_preview,\n                ensure_ascii=False\n            ),\n\
          \        \"evidence_coverage_preview_text\":\n            json.dumps(\n\
          \                evidence_coverage_preview,\n                ensure_ascii=False\n\
          \            )\n    }"
        code_language: python3

    - data:
        code: "import json\n\n\ndef main(\n    tax_case_id: str,\n    contract_documents:\
          \ list,\n    transaction_facts: list\n) -> dict:\n    if not isinstance(contract_documents,\
          \ list):\n        contract_documents = []\n\n    if not isinstance(transaction_facts,\
          \ list):\n        transaction_facts = []\n\n    case_id = (\n        tax_case_id\n\
          \        or \"TC-TAX-CROSS-001\"\n    )\n\n    contract_nodes = []\n   \
          \ source_document_ids = []\n\n    for index, document in enumerate(\n  \
          \      contract_documents\n    ):\n        if not isinstance(document, dict):\n\
          \            continue\n\n        source_document_id = (\n            document.get(\"\
          source_document_id\")\n            or f\"CONTRACT-DOCUMENT-{index + 1:03d}\"\
          \n        )\n\n        contract_fact_id = (\n            document.get(\"\
          contract_fact_id\")\n            or source_document_id\n        )\n\n  \
          \      source_document_ids.append(\n            source_document_id\n   \
          \     )\n\n        contract_nodes.append({\n            \"contract_node_id\"\
          :\n                f\"CHAIN-NODE-{index + 1:03d}\",\n            \"source_document_id\"\
          :\n                source_document_id,\n            \"contract_fact_id\"\
          :\n                contract_fact_id,\n            \"document_role\":\n \
          \               document.get(\n                    \"contract_document_role\"\
          \n                ) or \"related_contract\",\n            \"contract_name\"\
          :\n                document.get(\"contract_name\")\n                or contract_fact_id,\n\
          \            \"counterparty_name\":\n                document.get(\"counterparty_name\"\
          )\n                or \"unknown\",\n            \"subject_summary\":\n \
          \               document.get(\"subject_summary\")\n                or \"\
          \",\n            \"amount\": document.get(\"amount\"),\n            \"currency\"\
          :\n                document.get(\"currency\")\n                or \"CNY\"\
          ,\n            \"signing_date\":\n                document.get(\"signing_date\"\
          ),\n            \"economic_substance\":\n                document.get(\n\
          \                    \"economic_substance\"\n                ) or \"technical_consulting\"\
          \n        })\n\n    contract_edges = []\n\n    if len(contract_nodes) >\
          \ 1:\n        main_node = contract_nodes[0]\n\n        for related_node\
          \ in contract_nodes[1:]:\n            contract_edges.append({\n        \
          \        \"from_contract_node_id\":\n                    main_node[\"contract_node_id\"\
          ],\n                \"to_contract_node_id\":\n                    related_node[\"\
          contract_node_id\"],\n                \"relation_type\":\n             \
          \       \"related_service_contract\",\n                \"relation_status\"\
          : \"candidate\",\n                \"relation_reason\":\n               \
          \     \"多个合同事实共同关联至同一交易事实，\"\n                    \"具体法律关系仍需人工复核。\",\n \
          \               \"source_fact_ids\": [\n                    main_node[\"\
          contract_fact_id\"],\n                    related_node[\"contract_fact_id\"\
          ]\n                ]\n            })\n\n    transaction_fact_ids = []\n\n\
          \    for fact in transaction_facts:\n        if not isinstance(fact, dict):\n\
          \            continue\n\n        transaction_fact_id = fact.get(\n     \
          \       \"transaction_fact_id\"\n        )\n\n        if transaction_fact_id:\n\
          \            transaction_fact_ids.append(\n                transaction_fact_id\n\
          \            )\n\n    contract_chain = {\n        \"contract_chain_id\"\
          :\n            \"CONTRACT-CHAIN-TC-TAX-CROSS-001\",\n        \"chain_sequence_no\"\
          : 1,\n        \"chain_type\":\n            \"related_contract_group\",\n\
          \        \"chain_status\": \"candidate\",\n        \"contract_nodes\": contract_nodes,\n\
          \        \"contract_edges\": contract_edges,\n        \"source_document_ids\"\
          :\n            source_document_ids,\n        \"transaction_fact_ids\":\n\
          \            transaction_fact_ids,\n        \"chain_summary\":\n       \
          \     \"CT01、CT02、CT03共同组成多合同服务交易候选链。\",\n        \"trace\": {\n       \
          \     \"built_from\":\n                source_document_ids,\n          \
          \  \"notes\": [\n                \"Mock用于验证多合同分支接口。\",\n               \
          \ \"候选关系不等于已确认法律结论。\"\n            ]\n        }\n    }\n\n    contract_chains\
          \ = (\n        [contract_chain]\n        if contract_nodes\n        else\
          \ []\n    )\n\n    contract_chain_payload = {\n        \"tax_case_id\":\
          \ case_id,\n        \"contract_chains\": contract_chains\n    }\n\n    return\
          \ {\n        \"contract_chains\":\n            contract_chains,\n      \
          \  \"contract_chain_payload\":\n            contract_chain_payload,\n  \
          \      \"contract_chain_status\":\n            \"complete_needs_review\"\
          ,\n        \"contract_chain_payload_text\":\n            json.dumps(\n \
          \               contract_chain_payload,\n                ensure_ascii=False\n\
          \            )\n    }"

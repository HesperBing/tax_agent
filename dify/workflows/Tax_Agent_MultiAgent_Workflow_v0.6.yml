          \         judgement.get(\n                    \"judgement_status\",\n  \
          \                  \"unknown\"\n                ),\n\n            \"consistency_check\"\
          :\n                consistency.get(\n                    \"consistency_status\"\
          ,\n                    \"unknown\"\n                ),\n\n            \"\
          risk_analysis\":\n                risk_analysis.get(\n                 \
          \   \"analysis_status\",\n                    \"unknown\"\n            \
          \    ),\n\n            \"rule_engine\":\n                rule_engine.get(\n\
          \                    \"rule_engine_status\",\n                    \"unknown\"\
          \n                ),\n\n            \"case_rag\":\n                case_rag_status,\n\
          \n            \"evidence_review\":\n                evidence_review.get(\n\
          \                    \"evidence_review_status\",\n                    \"\
          unknown\"\n                )\n        },\n\n        \"tax_health_score\"\
          :\n            tax_health_score,\n\n        \"evidence_coverage\":\n   \
          \         evidence_coverage,\n\n        \"score_scope_limited\":\n     \
          \       score_scope_limited,\n\n        \"registered_evidence_instance_count\"\
          :\n            registered_instance_count,\n\n        \"scored_evidence_instance_count\"\
          :\n            scored_instance_count,\n\n        \"unregistered_evidence_request_count\"\
          :\n            len(\n                unregistered_requests\n           \
          \ ),\n\n        \"candidate_risk_count\":\n            len(\n          \
          \      candidate_summaries\n            ),\n\n        \"candidate_risks\"\
          :\n            candidate_summaries,\n\n        \"formal_risk_event_count\"\
          :\n            len(\n                formal_risk_events\n            ),\n\
          \n        \"formal_risk_events\":\n            formal_risk_events,\n\n \

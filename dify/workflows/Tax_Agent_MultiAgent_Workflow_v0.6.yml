    - data:
        code: "def main(valid_documents: list, query: str) -> dict:\n    if not isinstance(valid_documents,\
          \ list):\n        valid_documents = []\n\n    parts = []\n\n    for index,\
          \ item in enumerate(valid_documents):\n        if not isinstance(item, dict):\n\
          \            continue\n\n        document_text = item.get(\"document_text\"\
          , \"\")\n        if not isinstance(document_text, str) or not document_text.strip():\n\
          \            continue\n\n        source_file_type = item.get(\"source_file_type\"\
          ) or \"unknown\"\n        contract_document_role = item.get(\"contract_document_role\"\
          )\n\n        header = [\n            f\"DOCUMENT_INDEX: {index}\",\n   \
          \         f\"SOURCE_FILE_TYPE: {source_file_type}\",\n        ]\n\n    \
          \    if contract_document_role:\n            header.append(\n          \
          \      f\"CONTRACT_DOCUMENT_ROLE: {contract_document_role}\"\n         \
          \   )\n\n        parts.append(\n            \"\\n\".join(header)\n     \
          \       + \"\\nDOCUMENT_CONTENT:\\n\"\n            + document_text.strip()\n\
          \        )\n\n    facts_input_text = \"\\n\\n---DOCUMENT-END---\\n\\n\"\
          .join(parts)\n\n    return {\n        \"facts_input_text\": facts_input_text,\n\
          \        \"document_count\": len(parts),\n        \"user_query\": query\
          \ if isinstance(query, str) else \"\",\n        \"input_status\": \"ready\"\
          \ if parts else \"missing_documents\",\n    }"

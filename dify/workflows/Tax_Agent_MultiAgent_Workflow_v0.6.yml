          \ == 1:\n            impact_scope = 1\n        elif related_scope_count\
          \ <= 3:\n            impact_scope = 2\n        elif related_scope_count\
          \ <= 10:\n            impact_scope = 3\n        else:\n            impact_scope\
          \ = 4\n\n        weighted_severity = (\n            consequence * 0.25\n\
          \            + amount_impact * 0.20\n            + obligation * 0.30\n \
          \           + duration * 0.15\n            + impact_scope * 0.10\n     \
          \   )\n\n        health_score_loss = (\n            weighted_severity *\
          \ 10\n        )\n\n        if health_score_loss < 5:\n            risk_level\
          \ = \"low\"\n        elif health_score_loss < 15:\n            risk_level\
          \ = \"medium\"\n        elif health_score_loss < 25:\n            risk_level\
          \ = \"high\"\n        else:\n            risk_level = \"critical\"\n\n \
          \       scored_event = dict(event)\n\n        scored_event[\"score_dimensions\"\

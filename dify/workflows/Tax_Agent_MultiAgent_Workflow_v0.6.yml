          \                \"legal_basis_missing\"\n            )\n\n        for rule_id\
          \ in related_rule_ids:\n            result = as_dict(\n                consistency_map.get(\n\
          \                    rule_id\n                )\n            )\n\n     \
          \       consistency_status = (\n                result.get(\n          \
          \          \"consistency_status\"\n                )\n            )\n\n\
          \            if consistency_status in [\n                \"unknown\",\n\
          \                \"partial\",\n                \"inconsistent\"\n      \
          \      ]:\n                blocking_reasons.append(\n                  \
          \  \"consistency_\"\n                    + str(rule_id)\n              \
          \      + \"_\"\n                    + str(\n                        consistency_status\n\
          \                    )\n                )\n\n        blocking_reasons =\
          \ unique_list(\n            blocking_reasons\n        )\n\n        evaluation_status\
          \ = (\n            \"not_evaluable\"\n            if blocking_reasons\n\
          \            else \"ready_for_rule_evaluation\"\n        )\n\n        rule_execution_results.append({\n\
          \            \"rule_execution_id\":\n                \"RISK-EVAL-\"\n  \
          \              + str(index).zfill(3),\n\n            \"candidate_risk_id\"\
          :\n                candidate_id,\n\n            \"evaluation_status\":\n\
          \                evaluation_status,\n\n            \"expected_status\":\n\
          \                expected_status,\n\n            \"actual_comparison_fact_count\"\
          :\n                len(actual_comparison_facts),\n\n            \"related_consistency_rule_ids\"\
          :\n                related_rule_ids,\n\n            \"blocking_reasons\"\
          :\n                blocking_reasons,\n\n            \"formal_risk_generated\"\
          :\n                False\n        })\n\n    # 4. 正式风险事件生成门禁\n    formal_risk_events\
          \ = []\n\n    obligation_states = as_list(\n        actual_facts.get(\n\
          \            \"actual_obligation_states\"\n        )\n    )\n\n    invoice_module\
          \ = as_dict(\n        tax_judgement_payload.get(\n            \"invoice_obligation\"\
          \n        )\n    )\n\n    invoice_obligation = as_dict(\n        invoice_module.get(\n\
          \            \"obligation\"\n        )\n    )\n\n    invoice_expected =\
          \ (\n        invoice_obligation.get(\"status\")\n        == \"confirmed\"\
          \n        and invoice_obligation.get(\"value\")\n        is True\n    )\n\
          \n    for index, state_item in enumerate(\n        obligation_states,\n\
          \        start=1\n    ):\n        if not isinstance(state_item, dict):\n\
          \            continue\n\n        obligation_type = (\n            state_item.get(\n\
          \                \"obligation_type\"\n            )\n            or state_item.get(\"\
          type\")\n            or \"\"\n        )\n\n        actual_state = (\n  \
          \          state_item.get(\"state\")\n            or state_item.get(\n \
          \               \"actual_obligation_state\"\n            )\n           \
          \ or \"\"\n        )\n\n        state_id = (\n            state_item.get(\n\

    - data:
        code: "import json\n\n\ndef extract_payload(raw_text):\n    if not isinstance(raw_text,\
          \ str):\n        raise ValueError(\"LLM输出不是字符串\")\n\n    text = raw_text.strip()\n\
          \n    # 删除 DeepSeek 推理内容\n    if \"</think>\" in text:\n        text = text.split(\"\
          </think>\", 1)[1].strip()\n\n    # 删除可能存在的 Markdown 代码块\n    if text.startswith(\"\
          ```json\"):\n        text = text[7:].strip()\n    elif text.startswith(\"\
          ```\"):\n        text = text[3:].strip()\n\n    if text.endswith(\"```\"\
          ):\n        text = text[:-3].strip()\n\n    # 首选：整体直接解析\n    try:\n    \
          \    payload = json.loads(text)\n        if isinstance(payload, dict):\n\
          \            return payload\n    except Exception:\n        pass\n\n   \
          \ # 备用：从文本中寻找包含核心字段的 JSON 对象\n    decoder = json.JSONDecoder()\n    positions\
          \ = [\n        index\n        for index, character in enumerate(text)\n\
          \        if character == \"{\"\n    ]\n\n    for position in positions:\n\
          \        try:\n            candidate, _ = decoder.raw_decode(text[position:])\n\
          \n            if not isinstance(candidate, dict):\n                continue\n\
          \n            if (\n                \"contract_facts\" in candidate\n  \
          \              and \"actual_facts\" in candidate\n                and \"\
          evidence_state\" in candidate\n                and \"economic_substance\"\
          \ in candidate\n            ):\n                return candidate\n     \
          \   except Exception:\n            continue\n\n    raise ValueError(\"没有找到可解析的真实事实JSON对象\"\
          )\n\n\ndef main(raw_text: str, valid_documents: list) -> dict:\n    if not\
          \ isinstance(valid_documents, list):\n        valid_documents = []\n\n \
          \   try:\n        payload = extract_payload(raw_text)\n\n        contract_facts\
          \ = payload.get(\"contract_facts\")\n        actual_facts = payload.get(\"\
          actual_facts\")\n        evidence_state = payload.get(\"evidence_state\"\
          )\n        economic_substance = payload.get(\"economic_substance\")\n\n\
          \        if not isinstance(contract_facts, dict):\n            contract_facts\
          \ = {}\n\n        if not isinstance(actual_facts, dict):\n            actual_facts\
          \ = {}\n\n        if not isinstance(evidence_state, dict):\n           \
          \ evidence_state = {}\n\n        if not isinstance(economic_substance, dict):\n\
          \            economic_substance = {}\n\n        actual_invoices = actual_facts.get(\"\
          actual_invoices\", [])\n        actual_payments = actual_facts.get(\"actual_payments\"\
          , [])\n        actual_acceptances = actual_facts.get(\n            \"actual_acceptances\"\
          , []\n        )\n\n        if not isinstance(actual_invoices, list):\n \
          \           actual_invoices = []\n\n        if not isinstance(actual_payments,\
          \ list):\n            actual_payments = []\n\n        if not isinstance(actual_acceptances,\
          \ list):\n            actual_acceptances = []\n\n        facts_status =\
          \ payload.get(\"facts_status\", \"partial\")\n\n        if facts_status\
          \ not in {\n            \"complete_success\",\n            \"partial\",\n\
          \            \"failed\",\n        }:\n            facts_status = \"partial\"\
          \n\n        return {\n            \"source_documents\": valid_documents,\n\
          \            \"contract_facts\": contract_facts,\n            \"actual_facts\"\
          : actual_facts,\n            \"evidence_state\": evidence_state,\n     \
          \       \"economic_substance\": economic_substance,\n            \"facts_status\"\
          : facts_status,\n            \"facts_text\": json.dumps(\n             \
          \   payload,\n                ensure_ascii=False\n            ),\n     \
          \       \"economic_substance_text\": json.dumps(\n                economic_substance,\n\
          \                ensure_ascii=False\n            ),\n            \"evidence_state_text\"\
          : json.dumps(\n                evidence_state,\n                ensure_ascii=False\n\
          \            ),\n            \"contract_facts_text\": json.dumps(\n    \
          \            contract_facts,\n                ensure_ascii=False\n     \
          \       ),\n            \"actual_facts_text\": json.dumps(\n           \
          \     actual_facts,\n                ensure_ascii=False\n            ),\n\
          \            \"parse_status\": \"success\",\n            \"parse_message\"\
          : \"\",\n            \"invoice_count\": len(actual_invoices),\n        \
          \    \"payment_count\": len(actual_payments),\n            \"acceptance_count\"\
          : len(actual_acceptances),\n        }\n\n    except Exception as error:\n\
          \        return {\n            \"source_documents\": valid_documents,\n\
          \            \"contract_facts\": {},\n            \"actual_facts\": {},\n\
          \            \"evidence_state\": {},\n            \"economic_substance\"\
          : {},\n            \"facts_status\": \"failed\",\n            \"facts_text\"\
          : \"\",\n            \"economic_substance_text\": \"\",\n            \"\
          evidence_state_text\": \"\",\n            \"contract_facts_text\": \"\"\
          ,\n            \"actual_facts_text\": \"\",\n            \"parse_status\"\
          : \"failed\",\n            \"parse_message\": str(error),\n            \"\
          invoice_count\": 0,\n            \"payment_count\": 0,\n            \"acceptance_count\"\
          : 0,\n        }"

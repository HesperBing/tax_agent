          \      )\n            + \"，仅表示当前已确认范围内的\"\n            \"正式风险扣分结果，不代表税务完全健康。\"\
          \n        )\n    else:\n        warnings.append(\n            \"Tax Health\
          \ Score为\"\n            + display_number(\n                tax_health_score\n\
          \            )\n            + \"，应结合正式风险事件和\"\n            \"人工复核结果解释。\"\
          \n        )\n\n    if coverage_result:\n        coverage_warning = (\n \

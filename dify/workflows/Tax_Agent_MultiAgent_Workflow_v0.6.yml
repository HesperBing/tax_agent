    - data:
        code: "import json\n\n\ndef main(\n    contract_facts,\n    actual_facts,\n\
          \    economic_substance,\n    evidence_state,\n    regulation_result_payload,\n\
          \    tax_judgement_payload\n):\n    def as_dict(value):\n        return\
          \ value if isinstance(value, dict) else {}\n\n    def as_list(value):\n\
          \        return value if isinstance(value, list) else []\n\n    contract_facts\
          \ = as_dict(contract_facts)\n    actual_facts = as_dict(actual_facts)\n\
          \    economic_substance = as_dict(\n        economic_substance\n    )\n\
          \    evidence_state = as_dict(evidence_state)\n    regulation_result_payload\
          \ = as_dict(\n        regulation_result_payload\n    )\n    tax_judgement_payload\
          \ = as_dict(\n        tax_judgement_payload\n    )\n\n    tax_case_id =\
          \ (\n        contract_facts.get(\"tax_case_id\")\n        or actual_facts.get(\"\
          tax_case_id\")\n        or tax_judgement_payload.get(\n            \"tax_case_id\"\
          \n        )\n        or \"\"\n    )\n\n    contract_details = as_list(\n\
          \        contract_facts.get(\n            \"contract_content_details\"\n\
          \        )\n    )\n\n    contract_fact_ids = [\n        item.get(\"contract_content_detail_id\"\
          )\n        for item in contract_details\n        if isinstance(item, dict)\n\
          \        and item.get(\n            \"contract_content_detail_id\"\n   \
          \     )\n    ]\n\n    actual_sections = [\n        \"actual_payments\",\n\
          \        \"actual_invoices\",\n        \"actual_performances\",\n      \
          \  \"actual_acceptances\",\n        \"actual_settlements\",\n        \"\
          actual_pricing_bases\",\n        \"actual_expenses\",\n        \"actual_adjustments\"\
          ,\n        \"actual_agency_transactions\",\n        \"actual_withholdings\"\
          ,\n        \"actual_tax_filings\",\n        \"actual_tax_payments\",\n \
          \       \"actual_tax_treatments\",\n        \"actual_obligation_states\"\
          \n    ]\n\n    actual_fact_ids = []\n\n    for section in actual_sections:\n\
          \        for item in as_list(\n            actual_facts.get(section)\n \
          \       ):\n            if not isinstance(item, dict):\n               \
          \ continue\n\n            for key, value in item.items():\n            \
          \    if (\n                    key.endswith(\"_id\")\n                 \
          \   and isinstance(value, str)\n                    and value\n        \
          \        ):\n                    actual_fact_ids.append(value)\n\n    actual_fact_ids\
          \ = list(\n        dict.fromkeys(actual_fact_ids)\n    )\n\n    evidence_ids\
          \ = [\n        item.get(\"evidence_state_id\")\n        for item in as_list(\n\
          \            evidence_state.get(\n                \"evidence_states\"\n\
          \            )\n        )\n        if isinstance(item, dict)\n        and\
          \ item.get(\"evidence_state_id\")\n    ]\n\n    legal_obligation_ids = []\n\
          \n    for item in as_list(\n        regulation_result_payload.get(\n   \
          \         \"regulation_results\"\n        )\n    ):\n        if not isinstance(item,\
          \ dict):\n            continue\n\n        for law_id in as_list(\n     \
          \       item.get(\"legal_basis_ids\")\n        ):\n            if law_id:\n\
          \                legal_obligation_ids.append(\n                    law_id\n\
          \                )\n\n        if item.get(\"law_id\"):\n            legal_obligation_ids.append(\n\
          \                item[\"law_id\"]\n            )\n\n    legal_obligation_ids\
          \ = list(\n        dict.fromkeys(legal_obligation_ids)\n    )\n\n    acceptances\
          \ = as_list(\n        actual_facts.get(\n            \"actual_acceptances\"\
          \n        )\n    )\n\n    performances = as_list(\n        actual_facts.get(\n\
          \            \"actual_performances\"\n        )\n    )\n\n    invoices =\
          \ as_list(\n        actual_facts.get(\"actual_invoices\")\n    )\n\n   \
          \ withholdings = as_list(\n        actual_facts.get(\n            \"actual_withholdings\"\
          \n        )\n    )\n\n    judgement_status = (\n        tax_judgement_payload.get(\n\
          \            \"judgement_status\",\n            \"unknown\"\n        )\n\
          \    )\n\n    results = []\n\n    def add_result(\n        rule_id,\n  \
          \      applicability_status,\n        consistency_status,\n        differences,\n\
          \        review_required,\n        review_reason,\n        limitations,\n\
          \        contract_ids=None,\n        actual_ids=None,\n        legal_ids=None,\n\
          \        evidence_refs=None\n    ):\n        results.append({\n        \
          \    \"rule_id\": rule_id,\n            \"rule_version\": \"0.5\",\n   \
          \         \"applicability_status\":\n                applicability_status,\n\
          \            \"consistency_status\":\n                consistency_status,\n\
          \            \"contract_fact_ids\":\n                contract_ids\n    \
          \            if contract_ids is not None\n                else contract_fact_ids,\n\
          \            \"actual_fact_ids\":\n                actual_ids\n        \
          \        if actual_ids is not None\n                else actual_fact_ids,\n\
          \            \"legal_obligation_ids\":\n                legal_ids\n    \
          \            if legal_ids is not None\n                else [],\n      \
          \      \"evidence_ids\":\n                evidence_refs\n              \
          \  if evidence_refs is not None\n                else evidence_ids,\n  \
          \          \"differences\": differences,\n            \"review_required\"\
          :\n                review_required,\n            \"review_reason\": review_reason,\n\
          \            \"limitations\": limitations\n        })\n\n    # CC5-001：合同约定\
          \ vs 实际履约\n    if not contract_details:\n        add_result(\n         \
          \   \"CC5-001\",\n            \"unknown\",\n            \"unknown\",\n \
          \           [\"缺少合同约定事实\"],\n            True,\n            \"无法比较合同约定与实际履约\"\
          ,\n            [\"未取得结构化合同内容\"]\n        )\n    elif acceptances and not\
          \ performances:\n        add_result(\n            \"CC5-001\",\n       \
          \     \"applicable\",\n            \"partial\",\n            [\n       \
          \         \"存在验收记录，但缺少实际履约或交付事实\"\n            ],\n            True,\n \
          \           \"验收记录不能单独替代实际履约证明\",\n            [\n                \"无法确认交付内容、范围和质量是否与合同一致\"\
          \n            ]\n        )\n    elif not performances:\n        add_result(\n\
          \            \"CC5-001\",\n            \"applicable\",\n            \"unknown\"\
          ,\n            [\"未提供实际履约事实\"],\n            True,\n            \"无法完成合同与履约对账\"\
          ,\n            [\"材料缺失不得直接判定不一致\"]\n        )\n    else:\n        add_result(\n\
          \            \"CC5-001\",\n            \"applicable\",\n            \"partial\"\
          ,\n            [\n                \"已取得履约事实，但仍需逐项核对合同范围\"\n            ],\n\
          \            True,\n            \"需要核对交付内容、金额和期间\",\n            [\"当前仅完成结构化初步比较\"\
          ]\n        )\n\n    # CC5-002：实际交易 vs 经济实质\n    substance_components = as_list(\n\
          \        economic_substance.get(\n            \"economic_substance_components\"\
          \n        )\n    )\n\n    if not performances:\n        add_result(\n  \
          \          \"CC5-002\",\n            \"unknown\",\n            \"unknown\"\
          ,\n            [\n                \"缺少实际履约事实，无法验证经济实质分类\"\n            ],\n\
          \            True,\n            \"经济实质分类缺少实际履约支撑\",\n            [\n   \
          \             \"不得仅依据合同名称确认经济实质\"\n            ],\n            legal_ids=[]\n\
          \        )\n    elif not substance_components:\n        add_result(\n  \
          \          \"CC5-002\",\n            \"unknown\",\n            \"unknown\"\
          ,\n            [\"缺少经济实质分类结果\"],\n            True,\n            \"无法执行实际交易与经济实质比较\"\
          ,\n            []\n        )\n    else:\n        add_result(\n         \
          \   \"CC5-002\",\n            \"applicable\",\n            \"partial\",\n\
          \            [\n                \"经济实质分类需要与完整履约材料交叉核对\"\n            ],\n\
          \            True,\n            \"当前分类尚需证据验证\",\n            []\n      \
          \  )\n\n    # CC5-003：实际履约 vs 法定税务义务\n    if (\n        not performances\n\
          \        or not legal_obligation_ids\n    ):\n        add_result(\n    \
          \        \"CC5-003\",\n            \"unknown\",\n            \"unknown\"\
          ,\n            [\n                \"实际履约事实或有效法规义务不完整\"\n            ],\n\
          \            True,\n            \"无法比较实际履约与法定税务义务\",\n            [\n  \
          \              \"不得因材料缺失直接认定税务义务未履行\"\n            ],\n            legal_ids=legal_obligation_ids\n\
          \        )\n    else:\n        add_result(\n            \"CC5-003\",\n \
          \           \"applicable\",\n            \"partial\",\n            [\n \
          \               \"已取得候选法规，但仍需确认事件日期和适用条件\"\n            ],\n           \
          \ True,\n            \"法规适用性尚需复核\",\n            [],\n            legal_ids=legal_obligation_ids\n\
          \        )\n\n    # CC5-004A：发票条款与实际发票\n    if not invoices:\n        add_result(\n\
          \            \"CC5-004A\",\n            \"unknown\",\n            \"unknown\"\
          ,\n            [\"未提供结构化实际发票事实\"],\n            True,\n            \"无法核对发票类型、项目、金额和日期\"\
          ,\n            [\n                \"没有发票事实不等于未开具发票\"\n            ]\n  \
          \      )\n    else:\n        add_result(\n            \"CC5-004A\",\n  \
          \          \"applicable\",\n            \"partial\",\n            [\"需要逐项核对发票与合同及履约事实\"\
          ],\n            True,\n            \"发票一致性需要进一步核验\",\n            []\n \
          \       )\n\n    # CC5-004B：扣缴条款与实际扣缴\n    if not withholdings:\n      \
          \  add_result(\n            \"CC5-004B\",\n            \"unknown\",\n  \
          \          \"unknown\",\n            [\"未提供结构化扣缴事实\"],\n            True,\n\
          \            \"无法确认是否存在或履行扣缴义务\",\n            [\n                \"缺少扣缴事实不得直接生成风险\"\
          \n            ]\n        )\n    else:\n        add_result(\n           \
          \ \"CC5-004B\",\n            \"applicable\",\n            \"partial\",\n\
          \            [\"需要核对扣缴主体、税种、基数和日期\"],\n            True,\n            \"\
          扣缴事实仍需法规和凭证支持\",\n            []\n        )\n\n    # CC5-004C：税费承担条款\n \
          \   add_result(\n        \"CC5-004C\",\n        \"unknown\",\n        \"\
          unknown\",\n        [\"当前合同事实未结构化提取税费承担条款\"],\n        True,\n        \"\
          无法核对合同税费承担约定\",\n        [\n            \"合同约定不能替代法定纳税人或扣缴义务人\"\n      \
          \  ]\n    )\n\n    # CC5-005：已确认事实 vs Tax Judgement\n    if judgement_status\
          \ in [\n        \"unknown\",\n        \"partial\"\n    ]:\n        add_result(\n\
          \            \"CC5-005\",\n            \"applicable\",\n            \"partial\"\
          ,\n            [\n                \"Tax Judgement 尚包含 unknown 或 partial\
          \ 项\"\n            ],\n            True,\n            \"税务判断尚未达到完全确认状态\"\
          ,\n            [\n                \"不得将 partial 或 unknown 升级为 confirmed\"\
          \n            ],\n            legal_ids=legal_obligation_ids\n        )\n\
          \    else:\n        add_result(\n            \"CC5-005\",\n            \"\
          applicable\",\n            \"consistent\",\n            [],\n          \
          \  False,\n            \"\",\n            [],\n            legal_ids=legal_obligation_ids\n\
          \        )\n\n    statuses = [\n        item[\"consistency_status\"]\n \
          \       for item in results\n    ]\n\n    if \"inconsistent\" in statuses:\n\
          \        overall_status = \"inconsistent\"\n    elif \"partial\" in statuses:\n\
          \        overall_status = \"partial\"\n    elif statuses and all(\n    \
          \    status == \"consistent\"\n        for status in statuses\n    ):\n\
          \        overall_status = \"consistent\"\n    else:\n        overall_status\
          \ = \"unknown\"\n\n    review_required = any(\n        item[\"review_required\"\
          ]\n        for item in results\n    )\n\n    payload = {\n        \"tax_case_id\"\
          : tax_case_id,\n        \"consistency_status\":\n            overall_status,\n\
          \        \"review_required\":\n            review_required,\n        \"\
          legal_review_status\":\n            \"legal_review_pending\"\n         \
          \   if review_required\n            else \"not_required\",\n        \"consistency_check_results\"\
          :\n            results\n    }\n\n    node_status = (\n        \"complete_needs_review\"\
          \n        if review_required\n        else \"complete_success\"\n    )\n\
          \n    return {\n        \"consistency_check_payload\":\n            payload,\n\
          \        \"consistency_check_results\":\n            results,\n        \"\
          consistency_status\":\n            overall_status,\n        \"review_required\"\
          :\n            review_required,\n        \"consistency_check_node_status\"\
          :\n            node_status,\n        \"consistency_check_text\":\n     \
          \       json.dumps(\n                payload,\n                ensure_ascii=False\n\
          \            )\n    }"
        code_language: python3

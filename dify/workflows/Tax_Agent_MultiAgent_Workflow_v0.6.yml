            : [],\n      \"fact_basis_ids\": []\n    }\n  },\n  \"corporate_income_tax\"\
            : {\n    \"status\": \"confirmed|partial|unknown|not_applicable\",\n \
            \   \"applicability\": {\n      \"status\": \"\",\n      \"value\": null,\n\
            \      \"legal_basis_ids\": [],\n      \"fact_basis_ids\": []\n    },\n\
            \    \"income_type\": {\n      \"status\": \"\",\n      \"value\": null,\n\
            \      \"legal_basis_ids\": [],\n      \"fact_basis_ids\": []\n    },\n\
            \    \"taxable_income_basis\": {\n      \"status\": \"\",\n      \"value\"\
            : null,\n      \"legal_basis_ids\": [],\n      \"fact_basis_ids\": []\n\
            \    }\n  },\n  \"invoice_obligation\": {\n    \"status\": \"confirmed|partial|unknown|not_applicable\"\
            ,\n    \"obligation\": {\n      \"status\": \"\",\n      \"value\": null,\n\
            \      \"legal_basis_ids\": [],\n      \"fact_basis_ids\": []\n    },\n\
            \    \"invoice_content_consistency\": {\n      \"status\": \"\",\n   \
            \   \"value\": null,\n      \"legal_basis_ids\": [],\n      \"fact_basis_ids\"\
            : []\n    }\n  },\n  \"tax_timing\": {\n    \"status\": \"confirmed|partial|unknown|not_applicable\"\
            ,\n    \"selected_dates\": [],\n    \"date_basis\": [],\n    \"unresolved_date_issues\"\
            : []\n  },\n  \"manual_review_required\": true,\n  \"manual_review_reasons\"\
            : []\n}"

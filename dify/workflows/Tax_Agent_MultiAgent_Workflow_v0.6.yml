          \                evidence_warnings\n            )\n    }\n\n    # 7. 待处理项、未知项和人工复核门禁\n\
          \    unknown_items = []\n\n    for module_name in [\n        \"vat\",\n\
          \        \"surtax\",\n        \"corporate_income_tax\",\n        \"individual_income_tax\"\
          ,\n        \"withholding_obligation\",\n        \"invoice_obligation\",\n\
          \        \"tax_timing\",\n        \"tax_preference\",\n        \"tax_filing_payment\"\
          \n    ]:\n        module = (\n            tax_judgement_payload.get(\n \
          \               module_name\n            )\n        )\n\n        if (\n\
          \            isinstance(module, dict)\n            and module.get(\"status\"\
          )\n            in [\"unknown\", \"partial\"]\n        ):\n            unknown_items.append({\n\
          \                \"item_type\":\n                    \"tax_judgement_module\"\
          ,\n\n                \"module\":\n                    module_name,\n\n \
          \               \"status\":\n                    module.get(\"status\")\n\
          \            })\n\n    pending_items = []\n\n    for candidate in candidate_risks:\n\
          \        if isinstance(candidate, dict):\n            pending_items.append({\n\
          \                \"item_type\":\n                    \"candidate_risk\"\
          ,\n\n                \"item_id\":\n                    candidate.get(\n\
          \                        \"candidate_risk_id\"\n                    ),\n\
          \n                \"status\":\n                    candidate.get(\n    \
          \                    \"candidate_status\"\n                    )\n     \
          \       })\n\n    for request in evidence_requests:\n        if isinstance(request,\
          \ dict):\n            pending_items.append({\n                \"item_type\"\
          :\n                    \"evidence_request\",\n\n                \"item_id\"\
          :\n                    request.get(\n                        \"request_id\"\
          \n                    ),\n\n                \"status\":\n              \
          \      \"pending\"\n            })\n\n    manual_review_required = bool(\n\
          \        consistency_check_payload.get(\n            \"review_required\"\
          \n        )\n        or risk_analysis_payload.get(\n            \"manual_review_required\"\
          \n        )\n        or unknown_items\n        or pending_items\n    )\n\
          \n    rule_engine_status = (\n        \"complete_needs_review\"\n      \
          \  if manual_review_required\n        else \"complete_success\"\n    )\n\
          \n    # 8. 统一输出\n    rule_engine_input = {\n        \"tax_case_id\":\n \
          \           case_id,\n\n        \"transaction_fact_count\":\n          \
          \  len(transaction_facts),\n\n        \"candidate_risk_count\":\n      \
          \      len(candidate_risks),\n\n        \"consistency_result_count\":\n\
          \            len(consistency_results),\n\n        \"actual_comparison_fact_count\"\
          :\n            len(actual_comparison_facts),\n\n        \"evidence_instance_count\"\
          :\n            len(instances)\n    }\n\n    rule_engine_output = {\n   \
          \     \"tax_case_id\":\n            case_id,\n\n        \"rule_execution_results\"\
          :\n            rule_execution_results,\n\n        \"formal_risk_events\"\
          :\n            scored_risk_events,\n\n        \"score_result\":\n      \
          \      score_result,\n\n        \"evidence_coverage_result\":\n        \
          \    evidence_coverage_result,\n\n        \"pending_items\":\n         \
          \   pending_items,\n\n        \"unknown_items\":\n            unknown_items,\n\
          \n        \"manual_review_required\":\n            manual_review_required,\n\
          \n        \"rule_engine_status\":\n            rule_engine_status\n    }\n\
          \n    return {\n        \"rule_engine_input\":\n            rule_engine_input,\n\
          \n        \"rule_engine_output\":\n            rule_engine_output,\n\n \
          \       \"rule_execution_results\":\n            rule_execution_results,\n\
          \n        \"formal_risk_events\":\n            scored_risk_events,\n\n \
          \       \"score_result\":\n            score_result,\n\n        \"evidence_coverage_result\"\
          :\n            evidence_coverage_result,\n\n        \"pending_items\":\n\

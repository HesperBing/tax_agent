        code: "import json\nimport math\n\n\ndef parse_json_value(value):\n    \"\"\
          \"兼容 Dify Object/Array、JSON字符串和重复编码的JSON字符串。\"\"\"\n    current = value\n\
          \n    for _ in range(3):\n        if not isinstance(current, str):\n   \

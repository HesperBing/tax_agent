          \        scored_event[\n            \"health_score_loss\"\n        ] = health_score_loss\n\
          \n        scored_event[\n            \"risk_level\"\n        ] = risk_level\n\
          \n        total_health_score_loss += (\n            health_score_loss\n\
          \        )\n\n        scored_risk_events.append(\n            scored_event\n\
          \        )\n\n    tax_health_score = math.floor(\n        max(\n       \

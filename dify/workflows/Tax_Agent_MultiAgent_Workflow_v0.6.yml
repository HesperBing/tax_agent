          \n                \"related_transaction_fact_ids\":\n                  \
          \  [],\n\n                \"substance_codes\":\n                    []\n\
          \            })\n\n    # 5. Tax Health Score\n    scoring_profiles = {\n\
          \        \"tax_treatment_error\": {\n            \"tax_consequence_severity\"\
          : 2,\n            \"obligation_violation_severity\": 1\n        },\n   \
          \     \"tax_shortfall\": {\n            \"tax_consequence_severity\": 2,\n\

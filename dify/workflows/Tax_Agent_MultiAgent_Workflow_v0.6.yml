    - data:
        code: "import json\nimport re\n\n\ndef remove_reasoning(text):\n    text =\
          \ re.sub(\n        r\"<think>[\\s\\S]*?</think>\",\n        \"\",\n    \
          \    text,\n        flags=re.IGNORECASE\n    )\n\n    text = text.replace(\n\
          \        \"<!--dify-deepseek-reasoning-->\",\n        \"\"\n    )\n\n  \
          \  text = re.sub(\n        r\"```(?:json)?\",\n        \"\",\n        text,\n\
          \        flags=re.IGNORECASE\n    )\n\n    text = text.replace(\"```\",\
          \ \"\")\n\n    return text.strip()\n\n\ndef extract_json_object(text):\n\
          \    start = text.find(\"{\")\n\n    if start < 0:\n        raise ValueError(\"\
          没有找到 JSON 对象\")\n\n    depth = 0\n    in_string = False\n    escaped = False\n\
          \n    for index in range(start, len(text)):\n        char = text[index]\n\
          \n        if escaped:\n            escaped = False\n            continue\n\
          \n        if char == \"\\\\\" and in_string:\n            escaped = True\n\
          \            continue\n\n        if char == '\"':\n            in_string\
          \ = not in_string\n            continue\n\n        if in_string:\n     \
          \       continue\n\n        if char == \"{\":\n            depth += 1\n\
          \        elif char == \"}\":\n            depth -= 1\n\n            if depth\
          \ == 0:\n                return text[start:index + 1]\n\n    raise ValueError(\"\
          JSON 对象没有完整结束\")\n\n\ndef main(llm_text: str) -> dict:\n    original_text\
          \ = (\n        llm_text\n        if isinstance(llm_text, str)\n        else\
          \ \"\"\n    )\n\n    try:\n        cleaned_text = remove_reasoning(\n  \
          \          original_text\n        )\n\n        json_text = extract_json_object(\n\
          \            cleaned_text\n        )\n\n        payload = json.loads(json_text)\n\
          \n        if not isinstance(payload, dict):\n            raise ValueError(\n\
          \                \"Risk Analysis 不是对象\"\n            )\n\n        warnings\
          \ = []\n\n        allowed_analysis_statuses = {\n            \"complete\"\
          ,\n            \"partial\",\n            \"insufficient\"\n        }\n\n\
          \        analysis_status = payload.get(\n            \"analysis_status\"\
          ,\n            \"insufficient\"\n        )\n\n        if (\n           \
          \ analysis_status\n            not in allowed_analysis_statuses\n      \
          \  ):\n            analysis_status = \"insufficient\"\n            payload[\"\
          analysis_status\"] = (\n                analysis_status\n            )\n\
          \            warnings.append(\n                \"analysis_status 已修正\"\n\
          \            )\n\n        candidate_risks = payload.get(\n            \"\
          candidate_risks\",\n            []\n        )\n\n        if not isinstance(candidate_risks,\
          \ list):\n            candidate_risks = []\n            warnings.append(\n\
          \                \"candidate_risks 非数组，已清空\"\n            )\n\n        allowed_candidate_statuses\
          \ = {\n            \"candidate\",\n            \"insufficient_evidence\"\
          ,\n            \"not_supported\"\n        }\n\n        safe_candidates =\
          \ []\n\n        for item in candidate_risks:\n            if not isinstance(item,\
          \ dict):\n                continue\n\n            candidate_status = item.get(\n\
          \                \"candidate_status\",\n                \"insufficient_evidence\"\
          \n            )\n\n            if (\n                candidate_status\n\
          \                not in allowed_candidate_statuses\n            ):\n   \
          \             item[\"candidate_status\"] = (\n                    \"insufficient_evidence\"\
          \n                )\n                warnings.append(\n                \
          \    \"候选风险状态已降级\"\n                )\n\n            if item.get(\"risk_event_type\"\
          ):\n                item[\"risk_event_type\"] = None\n                warnings.append(\n\
          \                    \"Agent 2 的正式风险类型已清除\"\n                )\n\n     \
          \       item[\"manual_review_required\"] = (\n                True\n   \
          \         )\n\n            safe_candidates.append(item)\n\n        payload[\"\
          candidate_risks\"] = (\n            safe_candidates\n        )\n\n     \
          \   avoidance_signals = payload.get(\n            \"avoidance_signals\"\
          ,\n            []\n        )\n\n        if not isinstance(\n           \
          \ avoidance_signals,\n            list\n        ):\n            avoidance_signals\
          \ = []\n            warnings.append(\n                \"avoidance_signals\
          \ 非数组，已清空\"\n            )\n\n        safe_signals = []\n\n        for item\
          \ in avoidance_signals:\n            if not isinstance(item, dict):\n  \
          \              continue\n\n            signal_status = item.get(\n     \
          \           \"signal_status\",\n                \"insufficient_evidence\"\
          \n            )\n\n            if signal_status not in {\n             \
          \   \"observed\",\n                \"possible\",\n                \"insufficient_evidence\"\
          \n            }:\n                item[\"signal_status\"] = (\n        \
          \            \"insufficient_evidence\"\n                )\n            \
          \    warnings.append(\n                    \"避税分析线索状态已降级\"\n           \
          \     )\n\n            item[\"manual_review_required\"] = (\n          \
          \      True\n            )\n\n            safe_signals.append(item)\n\n\
          \        payload[\"avoidance_signals\"] = (\n            safe_signals\n\
          \        )\n\n        evidence_requests = payload.get(\n            \"evidence_requests\"\
          ,\n            []\n        )\n\n        if not isinstance(\n           \
          \ evidence_requests,\n            list\n        ):\n            evidence_requests\
          \ = []\n\n        payload[\"evidence_requests\"] = (\n            evidence_requests\n\
          \        )\n\n        # Agent 2 无权生成正式风险事件。\n        if payload.get(\"formal_risk_events\"\
          ):\n            warnings.append(\n                \"Agent 2 正式风险事件已强制清空\"\
          \n            )\n\n        payload[\"formal_risk_events\"] = []\n\n    \
          \    # 清除 Agent 2 权限之外的结果。\n        prohibited_fields = [\n            \"\
          risk_level\",\n            \"tax_health_score\",\n            \"health_score\"\
          ,\n            \"penalty_amount\",\n            \"final_legal_conclusion\"\
          \n        ]\n\n        for field in prohibited_fields:\n            if field\
          \ in payload:\n                payload.pop(field, None)\n              \
          \  warnings.append(\n                    field + \" 已清除\"\n            \
          \    )\n\n        manual_review_required = bool(\n            payload.get(\n\
          \                \"manual_review_required\",\n                True\n   \
          \         )\n            or safe_candidates\n            or safe_signals\n\
          \        )\n\n        payload[\"manual_review_required\"] = (\n        \
          \    manual_review_required\n        )\n\n        payload[\"validation_warnings\"\
          ] = (\n            warnings\n        )\n\n        node_status = (\n    \
          \        \"complete_needs_review\"\n            if manual_review_required\n\
          \            else \"complete_success\"\n        )\n\n        return {\n\
          \            \"risk_analysis_payload\":\n                payload,\n    \
          \        \"candidate_risks\":\n                safe_candidates,\n      \
          \      \"avoidance_signals\":\n                safe_signals,\n         \
          \   \"evidence_requests\":\n                evidence_requests,\n       \
          \     \"formal_risk_events\": [],\n            \"analysis_status\":\n  \
          \              analysis_status,\n            \"manual_review_required\"\
          :\n                manual_review_required,\n            \"agent2_node_status\"\
          :\n                node_status,\n            \"parse_status\": \"success\"\
          ,\n            \"parse_message\": \"\",\n            \"risk_analysis_text\"\
          :\n                json.dumps(\n                    payload,\n         \
          \           ensure_ascii=False\n                )\n        }\n\n    except\
          \ Exception as error:\n        fallback = {\n            \"tax_case_id\"\
          : \"\",\n            \"analysis_status\": \"insufficient\",\n          \
          \  \"candidate_risks\": [],\n            \"avoidance_signals\": [],\n  \
          \          \"evidence_requests\": [],\n            \"formal_risk_events\"\
          : [],\n            \"manual_review_required\": True,\n            \"manual_review_reasons\"\
          : [\n                \"Agent 2 输出无法解析\"\n            ]\n        }\n\n  \
          \      return {\n            \"risk_analysis_payload\":\n              \
          \  fallback,\n            \"candidate_risks\": [],\n            \"avoidance_signals\"\
          : [],\n            \"evidence_requests\": [],\n            \"formal_risk_events\"\
          : [],\n            \"analysis_status\":\n                \"insufficient\"\
          ,\n            \"manual_review_required\": True,\n            \"agent2_node_status\"\
          :\n                \"blocked_parse_error\",\n            \"parse_status\"\
          : \"failed\",\n            \"parse_message\": str(error),\n            \"\
          risk_analysis_text\":\n                json.dumps(\n                   \
          \ fallback,\n                    ensure_ascii=False\n                )\n\
          \        }"
        code_language: python3
        outputs:
          agent2_node_status:
            children: null

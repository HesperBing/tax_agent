          ,\n        \"individual_income_tax\":\n            \"individual_income_tax\"\
          ,\n        \"个人所得税\":\n            \"individual_income_tax\",\n\n      \
          \  \"invoice\": \"invoice_obligation\",\n        \"发票\": \"invoice_obligation\"\
          \n    }\n\n    statuses = []\n\n    for token in tokens:\n        module_name\
          \ = module_map.get(token)\n\n        if not module_name:\n            continue\n\
          \n        module = as_dict(\n            tax_judgement_payload.get(\n  \
          \              module_name\n            )\n        )\n\n        statuses.append(\n\
          \            module.get(\"status\", \"unknown\")\n        )\n\n    if not\
          \ statuses:\n        return \"unknown\"\n\n    if all(\n        status ==\
          \ \"confirmed\"\n        for status in statuses\n    ):\n        return\
          \ \"confirmed\"\n\n    if any(\n        status == \"partial\"\n        for\
          \ status in statuses\n    ):\n        return \"partial\"\n\n    return \"\
          unknown\"\n\n\ndef main(\n    tax_case_id,\n    transaction_facts,\n   \
          \ actual_facts,\n    evidence_state,\n    tax_judgement_payload,\n    consistency_check_payload,\n\
          \    risk_analysis_payload\n):\n    # 1. 统一解析输入类型\n    actual_facts = as_dict(actual_facts)\n\
          \    evidence_state = as_dict(evidence_state)\n\n    tax_judgement_payload\

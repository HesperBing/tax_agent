    - data:
        code: "import json\n\n\ndef safe_list(value):\n    return value if isinstance(value,\
          \ list) else []\n\n\ndef get_category(law_id):\n    law_id = law_id or \"\
          \"\n\n    if law_id.startswith(\"LAW_VAT\"):\n        return (\n       \
          \     \"value_added_tax\",\n            \"vat_applicability\",\n       \
          \ )\n\n    if law_id.startswith(\"LAW_INV\"):\n        return (\n      \
          \      \"invoice\",\n            \"invoice_obligation_and_consistency\"\
          ,\n        )\n\n    if law_id.startswith(\"LAW_CIT\"):\n        return (\n\
          \            \"corporate_income_tax\",\n            \"cit_deduction_and_tax_treatment\"\
          ,\n        )\n\n    if law_id.startswith(\"LAW_ANTI\"):\n        return\
          \ (\n            \"anti_avoidance\",\n            \"related_party_and_anti_avoidance\"\
          ,\n        )\n\n    if law_id.startswith(\"LAW_TCA\"):\n        return (\n\
          \            \"tax_collection_administration\",\n            \"tax_collection_and_procedure\"\
          ,\n        )\n\n    return (\n        \"other_tax\",\n        \"other_tax_regulation\"\
          ,\n    )\n\n\ndef main(\n    regulation_text: str,\n    transaction_facts_text:\
          \ str\n) -> dict:\n    try:\n        regulation_data = json.loads(\n   \
          \         regulation_text\n        )\n\n        if not isinstance(regulation_data,\
          \ dict):\n            raise ValueError(\n                \"historicalunifiedanalysis不是JSON对象\"\
          \n            )\n\n        transaction_data = {}\n\n        if isinstance(\n\
          \            transaction_facts_text,\n            str\n        ) and transaction_facts_text.strip():\n\
          \            try:\n                transaction_data = json.loads(\n    \
          \                transaction_facts_text\n                )\n           \
          \ except Exception:\n                transaction_data = {}\n\n        tax_case_id\
          \ = (\n            transaction_data.get(\"tax_case_id\")\n            if\
          \ isinstance(transaction_data, dict)\n            else None\n        ) or\
          \ \"TC-TAX-CROSS-001\"\n\n        selected_date = (\n            regulation_data.get(\"\
          selected_date\")\n            or \"\"\n        )\n\n        date_basis =\
          \ (\n            regulation_data.get(\"date_basis\")\n            or \"\"\
          \n        )\n\n        event_type = (\n            regulation_data.get(\"\
          event_type\")\n            or \"\"\n        )\n\n        confidence = regulation_data.get(\n\
          \            \"confidence\",\n            0\n        )\n\n        regulations\
          \ = safe_list(\n            regulation_data.get(\"regulations\")\n     \
          \   )\n\n        evidence_gaps = safe_list(\n            regulation_data.get(\"\
          evidence_gaps\")\n        )\n\n        manual_review_reasons = safe_list(\n\
          \            regulation_data.get(\n                \"manual_review_reasons\"\
          \n            )\n        )\n\n        warnings = safe_list(\n          \
          \  regulation_data.get(\"warnings\")\n        )\n\n        excluded_law_ids\
          \ = safe_list(\n            regulation_data.get(\n                \"excluded_law_ids\"\
          \n            )\n        )\n\n        date_field_map = {\n            \"\
          performance\": \"performance_date\",\n            \"delivery\": \"delivery_date\"\
          ,\n            \"receipt\": \"receipt_date\",\n            \"acceptance\"\
          : \"acceptance_date\",\n            \"invoice\": \"invoice_date\",\n   \
          \         \"payment\": \"payment_date\",\n        }\n\n        date_source_field\
          \ = date_field_map.get(\n            date_basis,\n            \"unknown_date\"\
          \n        )\n\n        grouped = {}\n\n        for regulation in regulations:\n\
          \            if not isinstance(regulation, dict):\n                continue\n\
          \n            law_id = regulation.get(\"law_id\")\n\n            tax_type,\
          \ judgement_item = (\n                get_category(law_id)\n           \
          \ )\n\n            group_key = (\n                tax_type,\n          \

          \            event.get(\n                \"scoring_profile_id\"\n      \
          \      ),\n            {\n                \"tax_consequence_severity\":\
          \ 0,\n                \"obligation_violation_severity\": 0\n           \
          \ }\n        )\n\n        consequence = profile.get(\n            \"tax_consequence_severity\"\
          ,\n            0\n        )\n\n        obligation = profile.get(\n     \
          \       \"obligation_violation_severity\",\n            0\n        )\n\n\
          \        # 未确认税额差异与持续期间时，\n        # 两个维度必须保持0。\n        amount_impact =\
          \ 0\n        duration = 0\n\n        related_scope_count = len(\n      \
          \      as_list(\n                event.get(\n                    \"related_transaction_fact_ids\"\

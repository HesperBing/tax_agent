          \        safe_number(\n            coverage_result.get(\n              \
          \  \"registered_instance_count\"\n            ),\n            0\n      \
          \  )\n    )\n\n    scored_instance_count = int(\n        safe_number(\n\
          \            coverage_result.get(\n                \"scored_instance_count\"\
          \n            ),\n            0\n        )\n    )\n\n    unregistered_requests\
          \ = safe_list(\n        coverage_result.get(\n            \"unregistered_evidence_requests\"\
          \n        )\n    )\n\n    # 健康分或证据覆盖率存在范围限制时，\n    # 总控统一标记scope_limited。\n\
          \    score_scope_limited = bool(\n        \"scope_limited\"\n        in\
          \ score_calculation_status\n        or \"scope_limited\"\n        in coverage_calculation_status\n\
          \        or coverage_result.get(\n            \"scope_limited\",\n     \
          \       False\n        )\n    )\n\n    # 8. 汇总人工复核状态\n    manual_review_required\
          \ = any([\n        bool(\n            judgement.get(\n                \"\
          manual_review_required\",\n                False\n            )\n      \
          \  ),\n        bool(\n            consistency.get(\n                \"review_required\"\

    - data:
        code: "import json\nimport re\n\n\nSCORE_THRESHOLD = 0.70\n\n\ndef ensure_list(value):\n\
          \    if isinstance(value, list):\n        return value\n\n    if isinstance(value,\
          \ str):\n        try:\n            parsed = json.loads(value)\n        \
          \    return parsed if isinstance(parsed, list) else []\n        except Exception:\n\
          \            return []\n\n    return []\n\n\ndef extract_line(content, label):\n\
          \    pattern = rf\"^{re.escape(label)}[：:]\\s*(.+)$\"\n    match = re.search(pattern,\
          \ content or \"\", flags=re.MULTILINE)\n\n    if not match:\n        return\
          \ \"\"\n\n    return match.group(1).strip()\n\n\ndef extract_metadata_json(content):\n\
          \    match = re.search(\n        r\"metadata_json[：:]\\s*(\\{[^\\r\\n]*\\\
          })\",\n        content or \"\"\n    )\n\n    if not match:\n        return\
          \ {}\n\n    try:\n        value = json.loads(match.group(1))\n        return\
          \ value if isinstance(value, dict) else {}\n    except Exception:\n    \
          \    return {}\n\n\ndef extract_case_id(content, metadata_json):\n    case_id\
          \ = metadata_json.get(\"case_id\")\n\n    if case_id:\n        return str(case_id).strip()\n\
          \n    case_id = extract_line(content, \"案例ID\")\n    return case_id.strip()\
          \ if case_id else \"\"\n\n\ndef safe_score(item):\n    metadata = item.get(\"\
          metadata\", {})\n    if not isinstance(metadata, dict):\n        metadata\
          \ = {}\n\n    value = item.get(\"score\", metadata.get(\"score\", 0))\n\n\
          \    try:\n        return float(value)\n    except Exception:\n        return\
          \ 0.0\n\n\ndef main(retrieval_results=None):\n    records = ensure_list(retrieval_results)\n\
          \n    matched_cases = []\n    rejected_case_count = 0\n\n    for item in\
          \ records:\n        if not isinstance(item, dict):\n            rejected_case_count\
          \ += 1\n            continue\n\n        content = str(item.get(\"content\"\
          ) or \"\")\n        metadata_json = extract_metadata_json(content)\n\n \
          \       case_id = extract_case_id(content, metadata_json)\n        tax_relevance\
          \ = str(\n            metadata_json.get(\"tax_relevance\") or \"unknown\"\
          \n        ).lower()\n\n        score = safe_score(item)\n\n        # 三项安全门禁：\n\
          \        # 1. 分数不低于0.70\n        # 2. 必须能够回溯到case_id\n        # 3. tax_relevance不能为low\n\
          \        if (\n            score + 1e-9 < SCORE_THRESHOLD\n            or\
          \ not case_id\n            or tax_relevance == \"low\"\n        ):\n   \
          \         rejected_case_count += 1\n            continue\n\n        matched_cases.append({\n\
          \            \"case_id\": case_id,\n            \"company\": metadata_json.get(\n\
          \                \"company\",\n                extract_line(content, \"\
          公司\")\n            ),\n            \"disposal_date\": metadata_json.get(\n\
          \                \"disposal_date\",\n                extract_line(content,\
          \ \"处理日期\")\n            ),\n            \"violation_type_codes\": metadata_json.get(\n\
          \                \"violation_type_codes\",\n                \"\"\n     \
          \       ),\n            \"tax_focus_codes\": metadata_json.get(\n      \
          \          \"tax_focus_codes\",\n                \"\"\n            ),\n\
          \            \"tax_relevance\": tax_relevance,\n            \"retrieval_score\"\
          : score,\n            \"fact_summary\": extract_line(content, \"违规事实/行为\"\
          ),\n            \"measure_summary\": extract_line(content, \"处理/处罚措施\"),\n\
          \            \"source_authority\": metadata_json.get(\n                \"\
          source_authority\",\n                \"\"\n            ),\n            \"\
          source_dataset\": metadata_json.get(\n                \"source_dataset\"\
          ,\n                \"\"\n            ),\n            \"source_row_number\"\
          : metadata_json.get(\n                \"source_row_number\",\n         \
          \       \"\"\n            ),\n            \"reference_only\": metadata_json.get(\n\
          \                \"reference_only\",\n                True\n           \
          \ ),\n            \"legal_conclusion_allowed\": metadata_json.get(\n   \
          \             \"legal_conclusion_allowed\",\n                False\n   \
          \         )\n        })\n\n    retrieval_status = (\n        \"matched\"\
          \ if matched_cases else \"no_match\"\n    )\n\n    limitations = [\n   \
          \     \"CSMAR案例仅作相似案例和风险模式参考，不替代有效法规。\",\n        \"不得仅凭相似案例认定当前交易违法、应补税、虚开发票或应受处罚。\"\
          ,\n        \"未匹配案例不代表当前交易没有税务风险。\"\n    ]\n\n    payload = {\n        \"\
          retrieval_status\": retrieval_status,\n        \"score_threshold\": SCORE_THRESHOLD,\n\
          \        \"matched_case_count\": len(matched_cases),\n        \"rejected_case_count\"\
          : rejected_case_count,\n        \"matched_cases\": matched_cases,\n    \
          \    \"manual_review_required\": True,\n        \"limitations\": limitations\n\
          \    }\n\n    return {\n        \"case_rag_payload\": payload,\n       \
          \ \"case_rag_text\": json.dumps(\n            payload,\n            ensure_ascii=False\n\
          \        ),\n        \"retrieval_status\": retrieval_status,\n        \"\
          matched_cases\": matched_cases,\n        \"matched_case_count\": len(matched_cases),\n\
          \        \"rejected_case_count\": rejected_case_count,\n        \"manual_review_required\"\
          : True\n    }"
        code_language: python3
        outputs:
          case_rag_payload:
            children: null
            type: object
          case_rag_text:
            children: null
            type: string
          manual_review_required:
            children: null
            type: boolean
          matched_case_count:
            children: null
            type: number
          matched_cases:
            children: null
            type: array[object]
          rejected_case_count:
            children: null
            type: number
          retrieval_status:
            children: null
            type: string

          \ += (\n        \"系统识别到\"\n        + str(\n            len(\n          \
          \      candidate_summaries\n            )\n        )\n        + \"个候选风险。\"\
          \n    )\n\n    if manual_review_required:\n        conclusion += (\n   \
          \         \"当前结果仍需补充证据并进行\"\n            \"人工复核。\"\n        )\n\n    if\

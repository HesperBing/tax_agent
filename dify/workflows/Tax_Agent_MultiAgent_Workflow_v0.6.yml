          \n            \"计算结果，需人工复核证据覆盖情况。\"\n        )\n\n    case_rag_status =\
          \ str(\n        case_rag.get(\n            \"retrieval_status\",\n     \
          \       \"unknown\"\n        )\n    )\n\n    if case_rag_status == \"no_match\"\
          :\n        warnings.append(\n            \"Case RAG未匹配相似案例，\"\n        \
          \    \"不代表当前交易不存在风险。\"\n        )\n    elif case_rag_status in [\n     \
          \   \"matched\",\n        \"complete\"\n    ]:\n        warnings.append(\n\
          \            \"Case RAG匹配结果仅用于风险模式\"\n            \"和证据结构参考，不得替代法律依据。\"\n\
          \        )\n    else:\n        warnings.append(\n            \"Case RAG状态为\"\
          \n            + case_rag_status\n            + \"，案例检索结果需人工复核。\"\n     \

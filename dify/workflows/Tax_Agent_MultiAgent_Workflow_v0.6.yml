    - data:
        code: "import json\nimport re\n\n\ndef remove_reasoning(text):\n    text =\
          \ re.sub(\n        r\"<think>[\\s\\S]*?</think>\",\n        \"\",\n    \
          \    text,\n        flags=re.IGNORECASE\n    )\n\n    text = text.replace(\n\
          \        \"<!--dify-deepseek-reasoning-->\",\n        \"\"\n    )\n\n  \
          \  text = re.sub(\n        r\"```(?:json)?\",\n        \"\",\n        text,\n\
          \        flags=re.IGNORECASE\n    )\n\n    text = text.replace(\"```\",\
          \ \"\")\n\n    return text.strip()\n\n\ndef extract_json_object(text):\n\
          \    start = text.find(\"{\")\n\n    if start < 0:\n        raise ValueError(\"\
          没有找到 JSON 对象\")\n\n    depth = 0\n    in_string = False\n    escaped = False\n\
          \n    for index in range(start, len(text)):\n        char = text[index]\n\
          \n        if escaped:\n            escaped = False\n            continue\n\
          \n        if char == \"\\\\\" and in_string:\n            escaped = True\n\
          \            continue\n\n        if char == '\"':\n            in_string\
          \ = not in_string\n            continue\n\n        if in_string:\n     \
          \       continue\n\n        if char == \"{\":\n            depth += 1\n\
          \        elif char == \"}\":\n            depth -= 1\n\n            if depth\
          \ == 0:\n                return text[start:index + 1]\n\n    raise ValueError(\"\
          JSON 对象没有完整结束\")\n\n\ndef main(llm_text: str) -> dict:\n    original_text\
          \ = (\n        llm_text\n        if isinstance(llm_text, str)\n        else\
          \ \"\"\n    )\n\n    try:\n        cleaned_text = remove_reasoning(\n  \
          \          original_text\n        )\n\n        json_text = extract_json_object(\n\
          \            cleaned_text\n        )\n\n        payload = json.loads(json_text)\n\
          \n        if not isinstance(payload, dict):\n            raise ValueError(\n\
          \                \"Tax Judgement 不是对象\"\n            )\n\n        allowed_statuses\
          \ = {\n            \"confirmed\",\n            \"partial\",\n          \
          \  \"unknown\",\n            \"not_applicable\"\n        }\n\n        judgement_status\
          \ = payload.get(\n            \"judgement_status\",\n            \"unknown\"\
          \n        )\n\n        if judgement_status not in allowed_statuses:\n  \
          \          judgement_status = \"unknown\"\n            payload[\"judgement_status\"\
          ] = \"unknown\"\n\n        manual_review_required = bool(\n            payload.get(\n\
          \                \"manual_review_required\",\n                judgement_status\
          \ != \"confirmed\"\n            )\n        )\n\n        node_status = (\n\
          \            \"complete_needs_review\"\n            if manual_review_required\n\
          \            or judgement_status != \"confirmed\"\n            else \"complete_success\"\
          \n        )\n\n        return {\n            \"tax_judgement_payload\":\
          \ payload,\n            \"tax_judgement_text\": json.dumps(\n          \
          \      payload,\n                ensure_ascii=False\n            ),\n  \
          \          \"judgement_status\":\n                judgement_status,\n  \
          \          \"tax_judgement_node_status\":\n                node_status,\n\
          \            \"parse_status\": \"success\",\n            \"parse_message\"\
          : \"\"\n        }\n\n    except Exception as error:\n        fallback_payload\
          \ = {\n            \"tax_case_id\": \"\",\n            \"judgement_status\"\
          : \"unknown\",\n            \"manual_review_required\": True,\n        \
          \    \"manual_review_reasons\": [\n                \"Agent 1 输出无法解析，需要人工复核\"\
          \n            ]\n        }\n\n        return {\n            \"tax_judgement_payload\"\
          :\n                fallback_payload,\n            \"tax_judgement_text\"\
          :\n                json.dumps(\n                    fallback_payload,\n\
          \                    ensure_ascii=False\n                ),\n          \
          \  \"judgement_status\": \"unknown\",\n            \"tax_judgement_node_status\"\
          :\n                \"blocked_parse_error\",\n            \"parse_status\"\
          : \"failed\",\n            \"parse_message\": str(error)\n        }"
        code_language: python3
        outputs:
          judgement_status:
            children: null
            type: string
          parse_message:
            children: null
            type: string
          parse_status:
            children: null
            type: string
          tax_judgement_node_status:
            children: null
            type: string
          tax_judgement_payload:
            children: null
            type: object
          tax_judgement_text:
            children: null
            type: string

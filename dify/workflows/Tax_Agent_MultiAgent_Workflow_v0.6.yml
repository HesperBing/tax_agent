          \    }\n\n    # 2. 收集可用于规则比较的实际税务事实\n    actual_comparison_sections = [\n\
          \        \"actual_invoices\",\n        \"actual_tax_filings\",\n       \
          \ \"actual_tax_payments\",\n        \"actual_tax_treatments\",\n       \
          \ \"actual_withholdings\",\n        \"actual_obligation_states\"\n    ]\n\
          \n    actual_comparison_facts = []\n\n    for section in actual_comparison_sections:\n\
          \        for item in as_list(\n            actual_facts.get(section)\n \
          \       ):\n            if isinstance(item, dict):\n                actual_comparison_facts.append(\n\
          \                    item\n                )\n\n    # 3. 对候选风险进行可评估性判断\n\
          \    # 候选风险不能直接升级为正式风险。\n    rule_execution_results = []\n\n    for index,\
          \ candidate in enumerate(\n        candidate_risks,\n        start=1\n \

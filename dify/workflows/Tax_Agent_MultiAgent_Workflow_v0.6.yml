          \               \"\"\n                ),\n\n            \"target_object_id\"\
          :\n                request.get(\n                    \"target_object_id\"\
          ,\n                    \"\"\n                )\n        })\n\n    next_actions.sort(\n\
          \        key=lambda item:\n            priority_order.get(\n           \
          \     item.get(\"priority\"),\n                9\n            )\n    )\n\
          \n    # 12. 汇总限制条件\n    limitations = safe_list(\n        evidence_review.get(\n\
          \            \"limitations\"\n        )\n    )\n\n    # 13. 动态生成警告\n   \
          \ warnings = safe_list(\n        evidence_review.get(\n            \"validation_warnings\"\
          \n        )\n    )\n\n    if not formal_risk_events:\n        warnings.append(\n\
          \            \"当前没有正式风险事件，\"\n            \"不得将候选风险表述为已确认违法。\"\n       \
          \ )\n\n    if \"scope_limited\" in (\n        score_calculation_status\n\
          \    ):\n        warnings.append(\n            \"Tax Health Score为\"\n \

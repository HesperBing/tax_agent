          \            return None\n\n        try:\n            current = json.loads(text)\n\
          \        except Exception:\n            return None\n\n    return current\n\
          \n\ndef as_dict(value):\n    parsed = parse_json_value(value)\n    return\
          \ parsed if isinstance(parsed, dict) else {}\n\n\ndef as_list(value):\n\
          \    parsed = parse_json_value(value)\n    return parsed if isinstance(parsed,\
          \ list) else []\n\n\ndef unique_list(values):\n    return list(dict.fromkeys(values))\n\
          \n\ndef resolve_expected_status(\n    tax_type,\n    tax_judgement_payload\n\
          ):\n    \"\"\"\n    处理VAT、CIT以及VAT;CIT等复合税种。\n    \"\"\"\n    text = str(tax_type\
          \ or \"\")\n\n    normalized = (\n        text.replace(\"；\", \";\")\n \
          \       .replace(\",\", \";\")\n        .replace(\"，\", \";\")\n    )\n\n\
          \    tokens = [\n        item.strip()\n        for item in normalized.split(\"\
          ;\")\n        if item.strip()\n    ]\n\n    module_map = {\n        \"VAT\"\
          : \"vat\",\n        \"value_added_tax\": \"vat\",\n        \"增值税\": \"vat\"\
          ,\n\n        \"CIT\": \"corporate_income_tax\",\n        \"Corporate Income\
          \ Tax\":\n            \"corporate_income_tax\",\n        \"corporate_income_tax\"\
          :\n            \"corporate_income_tax\",\n        \"企业所得税\":\n         \
          \   \"corporate_income_tax\",\n\n        \"IIT\": \"individual_income_tax\"\

    - data:
        code: "import json\n\n\ndef safe_list(value):\n    return value if isinstance(value,\
          \ list) else []\n\n\ndef safe_dict(value):\n    return value if isinstance(value,\
          \ dict) else {}\n\n\ndef main(facts_text: str) -> dict:\n    try:\n    \
          \    payload = json.loads(facts_text)\n\n        if not isinstance(payload,\
          \ dict):\n            raise ValueError(\"facts_text不是JSON对象\")\n\n     \
          \   tax_case_id = (\n            payload.get(\"tax_case_id\")\n        \
          \    or \"TC-TAX-CROSS-001\"\n        )\n\n        facts_status = payload.get(\"\
          facts_status\", \"partial\")\n\n        contract_facts = safe_dict(\n  \
          \          payload.get(\"contract_facts\")\n        )\n        actual_facts\
          \ = safe_dict(\n            payload.get(\"actual_facts\")\n        )\n \
          \       evidence_state = safe_dict(\n            payload.get(\"evidence_state\"\
          )\n        )\n        economic_substance = safe_dict(\n            payload.get(\"\
          economic_substance\")\n        )\n\n        components = safe_list(\n  \
          \          economic_substance.get(\n                \"economic_substance_components\"\
          \n            )\n        )\n\n        contracts = safe_list(\n         \
          \   contract_facts.get(\"contracts\")\n        )\n\n        contract_number_map\
          \ = {}\n\n        for contract in contracts:\n            if not isinstance(contract,\
          \ dict):\n                continue\n\n            contract_fact_id = contract.get(\n\
          \                \"contract_fact_id\"\n            )\n            contract_number\
          \ = contract.get(\n                \"contract_number\"\n            )\n\n\
          \            if contract_fact_id and contract_number:\n                contract_number_map[\n\
          \                    contract_fact_id\n                ] = contract_number\n\
          \n        requirement_instances = safe_list(\n            evidence_state.get(\n\
          \                \"evidence_requirement_instances\"\n            )\n   \
          \     )\n\n        evidence_states = safe_list(\n            evidence_state.get(\"\
          evidence_states\")\n        )\n\n        instance_map = {}\n\n        for\
          \ instance in requirement_instances:\n            if not isinstance(instance,\
          \ dict):\n                continue\n\n            instance_id = instance.get(\n\
          \                \"evidence_requirement_instance_id\"\n            )\n\n\
          \            if instance_id:\n                instance_map[instance_id]\
          \ = instance\n\n        transaction_facts = []\n\n        for index, component\
          \ in enumerate(\n            components,\n            start=1\n        ):\n\
          \            if not isinstance(component, dict):\n                continue\n\
          \n            substance_ref = (\n                component.get(\"substance_component_id\"\
          )\n                or f\"SUBSTANCE-{index:03d}\"\n            )\n\n    \
          \        substance_code = component.get(\n                \"substance_code\"\
          \n            )\n\n            contract_refs = safe_list(\n            \
          \    component.get(\"contract_fact_refs\")\n            )\n\n          \
          \  actual_refs = safe_list(\n                component.get(\"actual_fact_refs\"\
          )\n            )\n\n            contract_targets = set(contract_refs)\n\n\
          \            for contract_ref in contract_refs:\n                mapped_number\
          \ = contract_number_map.get(\n                    contract_ref\n       \
          \         )\n\n                if mapped_number:\n                    contract_targets.add(mapped_number)\n\
          \n            actual_ref_set = set(actual_refs)\n            evidence_state_refs\
          \ = []\n\n            for state_item in evidence_states:\n             \
          \   if not isinstance(state_item, dict):\n                    continue\n\
          \n                state_id = state_item.get(\n                    \"evidence_state_id\"\
          \n                )\n\n                related_actual_ids = set(\n     \
          \               safe_list(\n                        state_item.get(\n  \
          \                          \"related_actual_fact_ids\"\n               \
          \         )\n                    )\n                )\n\n              \
          \  instance_id = state_item.get(\n                    \"evidence_requirement_instance_id\"\
          \n                )\n\n                instance = instance_map.get(\n  \
          \                  instance_id,\n                    {}\n              \
          \  )\n\n                target_object_id = instance.get(\n             \
          \       \"target_object_id\"\n                )\n\n                actual_match\
          \ = bool(\n                    actual_ref_set\n                    & related_actual_ids\n\
          \                )\n\n                contract_match = (\n             \
          \       target_object_id\n                    in contract_targets\n    \
          \            )\n\n                if (\n                    state_id\n \
          \                   and (\n                        actual_match\n      \
          \                  or contract_match\n                    )\n          \
          \      ):\n                    evidence_state_refs.append(\n           \
          \             state_id\n                    )\n\n            transaction_fact\
          \ = {\n                \"transaction_fact_id\": (\n                    f\"\
          TRANSACTION-\"\n                    f\"{tax_case_id}-\"\n              \
          \      f\"{index:03d}\"\n                ),\n                \"economic_substance_ref\"\
          : substance_ref,\n                \"substance_code\": substance_code,\n\
          \                \"classification_status\": (\n                    component.get(\n\
          \                        \"classification_status\"\n                   \
          \ )\n                    or \"unknown\"\n                ),\n          \
          \      \"role\": (\n                    component.get(\"role\")\n      \
          \              or \"unknown\"\n                ),\n                \"amount\"\
          : component.get(\"amount\"),\n                \"currency\": (\n        \
          \            component.get(\"currency\")\n                    or \"CNY\"\
          \n                ),\n                \"contract_fact_refs\": contract_refs,\n\
          \                \"actual_fact_refs\": actual_refs,\n                \"\
          evidence_state_refs\": (\n                    list(\n                  \
          \      dict.fromkeys(\n                            evidence_state_refs\n\
          \                        )\n                    )\n                ),\n\
          \            }\n\n            transaction_facts.append(\n              \
          \  transaction_fact\n            )\n\n        if not transaction_facts:\n\
          \            transaction_status = \"failed\"\n        elif facts_status\
          \ == \"complete_success\":\n            transaction_status = \"complete_success\"\
          \n        else:\n            transaction_status = \"partial\"\n\n      \
          \  transaction_facts_payload = {\n            \"tax_case_id\": tax_case_id,\n\
          \            \"transaction_facts\": transaction_facts,\n            \"facts_status\"\
          : facts_status,\n        }\n\n        transaction_context = {\n        \
          \    \"tax_case_id\": tax_case_id,\n            \"transaction_facts\": transaction_facts,\n\
          \            \"contract_facts\": contract_facts,\n            \"actual_facts\"\
          : actual_facts,\n            \"evidence_state\": evidence_state,\n     \
          \       \"economic_substance\": economic_substance,\n            \"facts_status\"\
          : facts_status,\n        }\n\n        return {\n            \"tax_case_id\"\
          : tax_case_id,\n            \"transaction_facts\": transaction_facts,\n\
          \            \"transaction_facts_payload\": (\n                transaction_facts_payload\n\
          \            ),\n            \"transaction_facts_text\": json.dumps(\n \
          \               transaction_context,\n                ensure_ascii=False\n\
          \            ),\n            \"transaction_facts_status\": (\n         \
          \       transaction_status\n            ),\n            \"transaction_count\"\
          : len(\n                transaction_facts\n            ),\n            \"\
          parse_message\": \"\",\n        }\n\n    except Exception as error:\n  \
          \      return {\n            \"tax_case_id\": \"\",\n            \"transaction_facts\"\
          : [],\n            \"transaction_facts_payload\": {},\n            \"transaction_facts_text\"\
          : \"\",\n            \"transaction_facts_status\": \"failed\",\n       \
          \     \"transaction_count\": 0,\n            \"parse_message\": str(error),\n\
          \        }"
        code_language: python3

    - data:
        code: "import json\n\n\ndef ensure_list(value):\n    if isinstance(value,\
          \ list):\n        return value\n\n    if isinstance(value, str):\n     \
          \   try:\n            parsed = json.loads(value)\n            return parsed\
          \ if isinstance(parsed, list) else []\n        except Exception:\n     \
          \       return []\n\n    return []\n\n\ndef clean_text(value):\n    if value\
          \ is None:\n        return \"\"\n\n    if isinstance(value, (dict, list)):\n\
          \        return json.dumps(value, ensure_ascii=False)\n\n    return str(value).strip()\n\
          \n\ndef main(candidate_risks=None):\n    candidates = ensure_list(candidate_risks)\n\
          \n    # Case RAG 与 Rule Engine 并行，\n    # 因此这里只使用 Agent 2 生成的候选风险\n    selected_items\
          \ = candidates[:3]\n\n    if selected_items:\n        query_source = \"\
          candidate_risks\"\n    else:\n        query_source = \"none\"\n\n    query_parts\
          \ = []\n\n    for item in selected_items:\n        if not isinstance(item,\
          \ dict):\n            continue\n\n        for field in [\n            \"\
          risk_code\",\n            \"risk_nature\",\n            \"risk_event_type\"\
          ,\n            \"tax_type\",\n            \"hypothesis\",\n            \"\
          description\"\n        ]:\n            value = clean_text(item.get(field))\n\
          \n            if value and value not in query_parts:\n                query_parts.append(value)\n\
          \n    if query_parts:\n        case_rag_query = (\n            \"查询相似税务处罚案例和证据结构，仅作风险模式参考：\"\
          \n            + \"；\".join(query_parts)\n        )\n        query_status\
          \ = \"ready\"\n    else:\n        case_rag_query = (\n            \"当前没有可用于案例检索的候选风险，\"\
          \n            \"不得强行匹配处罚案例。\"\n        )\n        query_status = \"no_risk_input\"\
          \n\n    return {\n        \"case_rag_query\": case_rag_query[:2000],\n \
          \       \"query_source\": query_source,\n        \"risk_item_count\": len(selected_items),\n\
          \        \"query_status\": query_status\n    }"

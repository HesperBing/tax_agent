          \ = as_dict(\n        consistency_check_payload\n    )\n\n    risk_analysis_payload\
          \ = as_dict(\n        risk_analysis_payload\n    )\n\n    # transaction_facts_text最外层是对象，\n\
          \    # 真正的交易事实数组位于transaction_facts字段。\n    transaction_payload = as_dict(\n\
          \        transaction_facts\n    )\n\n    if transaction_payload:\n     \
          \   transaction_facts = as_list(\n            transaction_payload.get(\n\
          \                \"transaction_facts\"\n            )\n        )\n    else:\n\
          \        transaction_facts = as_list(\n            transaction_facts\n \
          \       )\n\n    case_id = (\n        tax_case_id\n        or transaction_payload.get(\n\
          \            \"tax_case_id\"\n        )\n        or actual_facts.get(\n\
          \            \"tax_case_id\"\n        )\n        or evidence_state.get(\n\
          \            \"tax_case_id\"\n        )\n        or tax_judgement_payload.get(\n\
          \            \"tax_case_id\"\n        )\n        or consistency_check_payload.get(\n\
          \            \"tax_case_id\"\n        )\n        or risk_analysis_payload.get(\n\
          \            \"tax_case_id\"\n        )\n        or \"\"\n    )\n\n    candidate_risks\
          \ = as_list(\n        risk_analysis_payload.get(\n            \"candidate_risks\"\
          \n        )\n    )\n\n    consistency_results = as_list(\n        consistency_check_payload.get(\n\
          \            \"consistency_check_results\"\n        )\n    )\n\n    consistency_map\
          \ = {\n        item.get(\"rule_id\"): item\n        for item in consistency_results\n\
